---
openapi: 3.0.3
info:
  title: 무빙 (Moving) API
  version: 0.1.0
  description: |
    이사 소비자(CUSTOMER)와 이사 전문가(MOVER, 기사님) 매칭 서비스의 초기 API 초안.

servers:
  - { url: '/api' }
tags:
  - { name: Auth }
  - { name: Me }
  - { name: Profiles }
  - { name: Uploads }
  - { name: Movers }
  - { name: Favorites }
  - { name: MoveRequests }
  - { name: MoverInbox }
  - { name: Quotes }
  - { name: Reviews }
  - { name: Notifications }
paths:
  '/auth/signup':
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: 요청한 역할의 이메일 계정을 생성하고 로그인 세션을 발급합니다. 이름·이메일·전화번호·비밀번호는 validator 기준에 따라 검증합니다.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Me'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '409':
          description: '`EMAIL_ALREADY_EXISTS`. 같은 역할로 이미 가입된 이메일인 경우'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
        '429':
          '$ref': '#/components/responses/RateLimited'
  '/auth/login':
    post:
      tags: [Auth]
      summary: 이메일 로그인
      description: 역할별 로그인 페이지에서 요청한 역할과 이메일·비밀번호를 확인하고 사용자 정보를 반환합니다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AuthResponse'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          description: '`INVALID_CREDENTIALS`'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
        '429':
          '$ref': '#/components/responses/RateLimited'
  '/auth/{provider}':
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작 (provider로 리다이렉트)
      description: |
        선택한 소셜 제공자(Google / Kakao / Naver) 인가 페이지로 이동합니다.
        `role`은 OAuth `state`에 서명되어 콜백에서 복원됩니다.
        제공자 앱 Client ID/Secret과 Redirect URI 환경 변수가 필요합니다.
      operationId: startSocialLogin
      security: []
      parameters:
        - { '$ref': '#/components/parameters/ProviderPath' }
        - name: role
          in: query
          required: true
          schema: { '$ref': '#/components/schemas/Role' }
      responses:
        '200': { description: OAuth 인증 요청 안내 }
        '302':
          {
            description: Google / Kakao / Naver 인가(authorize) URL로 리다이렉트,
          }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401':
          description: '`SOCIAL_LOGIN_FAILED` (OAuth 설정 누락 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/auth/{provider}/callback':
    get:
      tags: [Auth]
      summary: 소셜 로그인 콜백 (등록된 redirect URI)
      description: 소셜 제공자의 응답을 검증한 뒤 가입 또는 로그인합니다.
      operationId: socialLoginCallback
      security: []
      parameters:
        - { '$ref': '#/components/parameters/ProviderPath' }
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 로그인 결과 화면으로 이동
          headers:
            Location:
              description: 로그인 결과에 따른 프론트엔드 이동 URL
              schema:
                type: string
        '400':
          description: 잘못된 OAuth 요청 또는 인증 실패
        '401':
          description: OAuth 인증 실패
        '500':
          description: 서버 내부 오류
  '/auth/logout':
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 현재 로그인된 세션을 종료하고 세션 쿠키를 삭제합니다.
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: 로그아웃되었습니다.
        '401':
          description: 인증되지 않은 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 로그아웃 처리 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/users/me':
    get:
      tags: [Me]
      summary: 내 정보 (GNB, 라우트 가드용)
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Me' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      summary: 기본 정보 수정
      description: 일반 유저 정보 수정과 기사님 기본정보 수정에서 사용합니다. 변경 가능 항목과 인증 확인 방식은 추후 결정합니다.
      operationId: updateMe
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/BasicInfoUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Me' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
  '/customers/me/profile':
    post:
      tags: [Profiles]
      summary: 일반 유저 프로필 등록
      operationId: createCustomerProfile
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomerProfileCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/CustomerProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`PROFILE_ALREADY_EXISTS`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Profiles]
      summary: 일반 유저 프로필 수정
      operationId: updateCustomerProfile
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomerProfileUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/CustomerProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/profile':
    post:
      tags: [Profiles]
      summary: 기사님 프로필 등록
      operationId: createMoverProfile
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoverProfileCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`PROFILE_ALREADY_EXISTS`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Profiles]
      summary: 기사님 프로필 수정
      operationId: updateMoverProfile
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoverProfileUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me':
    get:
      tags: [Profiles]
      summary: 기사님 마이페이지 (내 프로필·평점)
      operationId: getMyMoverPage
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      responses:
        '200':
          description: 공개 기사님 상세와 같은 형태. `isFavorite`, `isDesignated`는 null입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverDetail' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/uploads/images':
    post:
      tags: [Uploads]
      summary: 프로필 이미지 업로드
      description: 프로필 등록·수정에 사용할 이미지 URL을 반환합니다. 저장소, 허용 형식 및 용량 제한은 추후 결정합니다.
      operationId: uploadImage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/UploadResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
  '/movers':
    get:
      tags: [Movers]
      summary: 기사님 목록 (검색·정렬·필터·무한 스크롤)
      description: |
        공개 API. 로그인한 일반 유저가 호출하면 `isFavorite`가 채워지고, 그 외에는 null입니다.
        프로필을 등록한 기사님만 목록에 노출됩니다.
        검색어와 필터는 함께 적용되며, 다음 페이지를 요청할 때는 첫 페이지와 같은 조건에 `cursor`를 더해 보냅니다.
      operationId: listMovers
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          description: 기사님 별명, 한 줄 소개 또는 상세 설명 부분 검색 (대소문자 구분 없음). 앞뒤 공백은 제거하며, 빈 값이면 적용하지 않습니다.
          schema: { type: string }
        - name: region
          in: query
          description: 서비스 지역에 이 지역이 포함된 기사님만 조회합니다. 빈 값이면 적용하지 않습니다.
          schema: { '$ref': '#/components/schemas/Region' }
        - name: serviceType
          in: query
          description: 이 서비스를 제공하는 기사님만 조회합니다.
          schema: { '$ref': '#/components/schemas/ServiceType' }
        - name: sort
          in: query
          description: 생략하면 `REVIEW_COUNT`
          schema: { '$ref': '#/components/schemas/MoverSort' }
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 기사님 목록 페이지. 조건에 맞는 기사님이 없으면 `items`는 빈 배열, `nextCursor`는 null, `hasNext`는 false입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverListResponse' }
        '400':
          description: '`VALIDATION_ERROR`. `sort`·`serviceType`·`limit`이 허용 범위를 벗어나거나, `cursor`가 잘못된 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/InvalidSession' }
  '/movers/{moverId}':
    get:
      tags: [Movers]
      summary: 기사님 상세 (SNS 공유 링크 대상)
      description: |
        공개 API. 로그인한 일반 유저라면 `isFavorite`가 채워지고, `isDesignated`는 이 기사님이
        해당 유저의 활성 견적 요청에 이미 지정되어 있는지를 나타냅니다.
        `ratingCounts`는 1~5점별 리뷰 수입니다. 프로필을 등록한 기사님만 조회됩니다 (404).
      operationId: getMover
      security:
        - {}
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 기사님 상세
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverDetail' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/InvalidSession' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/{moverId}/reviews':
    get:
      tags: [Movers, Reviews]
      summary: 기사님이 받은 리뷰 (페이지네이션)
      description: |
        공개 API. 기사님 본인 마이페이지에서도 사용합니다.
        최근에 작성된 리뷰부터 보여주며, 작성자 이름은 첫 글자만 남기고 `*`로 가립니다.
      operationId: listMoverReviews
      security: []
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 목록 페이지. 리뷰가 없으면 `items`는 빈 배열, `totalCount`와 `totalPages`는 0입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverReviewListResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/{moverId}/favorite':
    put:
      tags: [Favorites]
      summary: 찜하기 (멱등)
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 이미 찜한 기사님이면 그대로 두고 현재 상태를 반환합니다.
        프로필을 등록하지 않은 기사님은 찜할 수 없습니다 (404).
      operationId: addFavorite
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 찜한 상태와 기사님의 전체 찜 수
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteState' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
    delete:
      tags: [Favorites]
      summary: 찜 해제 (멱등)
      description: 찜하지 않은 기사님이면 그대로 두고 현재 상태를 반환합니다. 그 외 조건은 찜하기와 같습니다.
      operationId: removeFavorite
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 찜 해제된 상태와 기사님의 전체 찜 수
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteState' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/customers/me/favorites':
    get:
      tags: [Favorites]
      summary: 찜한 기사님 목록
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 최근에 찜한 기사님부터 보여주며, 찜을 취소한 기사님은 빠집니다.
        PC 사이드바에서는 `limit=3`으로 최대 3명을 표시할 수 있습니다. 다음 페이지를 요청할 때는 `cursor`를 더해 보내며, 그 사이에 찜을 취소했더라도 이어서 조회됩니다.
      operationId: listMyFavorites
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 찜한 기사님 목록 페이지 (`isFavorite`는 항상 true, `totalCount`는 찜한 기사님 전체 수). 찜한 기사님이 없으면 `items`는 빈 배열, `totalCount`는 0, `nextCursor`는 null, `hasNext`는 false입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteListResponse' }
        '400':
          description: '`VALIDATION_ERROR`. `limit`이 허용 범위를 벗어나거나 `cursor`가 잘못된 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
    delete:
      tags: [Favorites]
      summary: 찜 일괄 해제 (멱등)
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 찜한 기사님 페이지의 선택 항목 삭제에 씁니다.
        화면에서 선택한 기사님의 id를 `moverIds`로 보내면 그 기사님들만 해제합니다. 전체 선택도 화면에 보이는 기사님만 선택하므로 같은 방식으로 보냅니다.
        `all: true`를 보내면 본인의 찜을 모두 해제합니다. 찜하지 않았거나 없는 기사님과 중복된 id는 건너뛰고 실제 해제된 수를 반환하며, `moverIds`는 한 번에 최대 500개입니다.
      operationId: removeMyFavorites
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/FavoriteRemoveRequest' }
            examples:
              selected:
                summary: 선택한 기사님 해제
                value:
                  moverIds:
                    - 11111111-1111-4111-8111-111111111111
                    - 22222222-2222-4222-8222-222222222222
              all:
                summary: 전체 해제
                value: { all: true }
      responses:
        '200':
          description: 이번 요청으로 실제 해제된 찜 수. 해제된 찜이 없으면 0입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteRemoveResult' }
        '400':
          description: '`VALIDATION_ERROR`. `moverIds`가 없거나 비어 있거나, 500개를 넘거나, uuid가 아닌 값이 있거나, `all: true`와 `moverIds`를 함께 보낸 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests':
    post:
      tags: [MoveRequests]
      summary: 일반 견적 요청 생성
      description: |-
        §4.2에 따라 이사일이 지나기 전에는 새 요청을 만들 수 없으며 활성 요청은 한 번에 하나입니다.
        활성 요청은 상태가 `PENDING`, `CONFIRMED`, `COMPLETED` 중 하나이고 이사일이 지나지 않은 요청입니다.
        서버는 요청 상태와 이사일을 함께 확인하며, 이사일이 지난 요청은 새 요청을 만들 때 `EXPIRED` 또는 `COMPLETED`로 바꿉니다.
        이사 완료 처리만으로 이사일 이전에 새 요청을 허용하지 않습니다.
        날짜는 한국 시간(Asia/Seoul) 기준이며 오늘 날짜로도 요청할 수 있습니다.
        출발지와 도착지의 지역은 서버가 주소의 첫 단어(시/도)로 판별하며, 강원도, 전라북도, 제주도처럼 바뀌기 전 명칭과 줄임 명칭도 인식합니다.
        새 요청을 모든 서비스 지역의 기사님들에게 알립니다.
        입력 중 수정(§4.1.4)은 제출 전 프론트엔드 폼에서 처리합니다.
      operationId: createMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoveRequestCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveRequest' }
        '400':
          description:
            '`VALIDATION_ERROR`. 필수 정보가 없거나, 이사 날짜가 한국 시간 기준으로 지났거나, 주소에서 시/도를 판별할 수
            없는 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`ACTIVE_REQUEST_EXISTS`. 활성 요청이 이미 있는 경우. 여러 번 또는 동시에 제출해도 요청은 하나만 생성됩니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/active':
    get:
      tags: [MoveRequests]
      summary: 현재 활성 견적 요청 (없으면 null)
      description: |-
        §4.2.1의 활성 요청을 반환합니다. 활성 여부는 견적 요청 생성의 제한과 같은 기준으로 판단합니다.
        이사일이 지난 요청은 아직 `EXPIRED` 또는 `COMPLETED`로 바뀌지 않았어도 반환하지 않습니다.
      operationId: getActiveMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      responses:
        '200':
          description: 활성 견적 요청 또는 null
          content:
            application/json:
              schema:
                type: object
                required: [moveRequest]
                properties:
                  moveRequest:
                    type: object
                    nullable: true
                    allOf:
                      - { '$ref': '#/components/schemas/MoveRequest' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests/history':
    get:
      tags: [MoveRequests]
      summary: 받았던 견적 (지난 요청 + 받은 견적 전체)
      description: 완료된 이사의 정보와 받은 전체 견적을 반환합니다. 확정 견적 필터를 제공합니다.
      operationId: listMoveRequestHistory
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - name: confirmedOnly
          in: query
          description: 확정된 견적만 조회
          schema: { type: boolean }
        - { '$ref': '#/components/parameters/Cursor' }
        - { '$ref': '#/components/parameters/Limit' }
      responses:
        '200':
          description: 지난 견적 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/MoveRequestHistoryResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests/{requestId}':
    get:
      tags: [MoveRequests]
      summary: 견적 요청 상세 (요청자 본인)
      description: 이사일이 지났거나 종료된 요청도 조회할 수 있습니다. 다른 사용자의 요청은 없는 요청과 같이 404를 반환합니다.
      operationId: getMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      responses:
        '200':
          description: 견적 요청
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveRequest' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/move-requests/{requestId}/designations':
    post:
      tags: [MoveRequests]
      summary: 지정 견적 요청
      description: |-
        호출자 본인의 일반 견적 요청이 먼저 있어야 합니다(§6.5). 대기 중이고 이사일이 지나지 않은 요청에 기사님을 지정합니다.
        한 요청에 기사님을 최대 3명까지 지정할 수 있으며, 동시에 요청해도 인원과 중복 제한을 지킵니다(§7.1.1).
        이 요청에 이미 견적을 보냈거나 요청을 반려한 기사님은 지정할 수 없습니다.
        지정 요청은 기사님에게 라벨로 강조 표시하며, 기사님의 서비스 가능 지역과 관계없이 요청할 수 있습니다.
      operationId: designateMover
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/DesignationCreate' }
      responses:
        '201':
          description: 지정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Designation' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404':
          description:
            '`NOT_FOUND`. 요청이 없거나 다른 사용자의 요청인 경우. 기사님이 없는 경우에는 `details`에 `moverId`가
            담깁니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '409':
          description:
            '`REQUEST_NOT_PENDING` (확정되었거나 이사일이 지난 요청), `ALREADY_DESIGNATED` (이미 지정한 기사님),
            `MOVER_ALREADY_RESPONDED` (이미 견적을 보냈거나 요청을 반려한 기사님) 또는 `DESIGNATION_LIMIT_REACHED`
            (이미 3명을 지정함)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/{requestId}/quotes':
    get:
      tags: [MoveRequests]
      summary: 받은 견적 목록 (대기 중인 견적)
      description:
        요청자 본인만 조회합니다. 지정 요청 라벨과 기사님 찜 상태를 제공합니다. 최대 8개이므로 별도 페이지네이션은 두지
        않습니다.
      operationId: listQuotesForRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
        - name: status
          in: query
          schema: { '$ref': '#/components/schemas/QuoteStatus' }
      responses:
        '200':
          description: 견적 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 8
                    items: { '$ref': '#/components/schemas/CustomerQuote' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
    post:
      tags: [MoverInbox]
      summary: 견적 보내기 (기사님)
      description: |-
        기사님은 모든 서비스 지역의 받은 요청에 가격을 입력하여 견적을 보냅니다(§8.1–8.2).
        지정된 기사님도 지역 제한 없이 견적을 보낼 수 있습니다. 확정되거나 이사일이 지난 요청에는 견적을 보내지 않습니다.
        일반 견적 최대 5개, 지정 견적 최대 3개, 총 최대 8개를 동시 요청에서도 지킵니다(§7.1.1).
        지정 여부의 견적 분류 시점과 재응답 정책은 추후 결정합니다. 일반 유저에게 새 견적 알림을 보냅니다.
      operationId: sendQuote
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/QuoteCreate' }
      responses:
        '201':
          description: 전송 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/SentQuote' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`, `PROFILE_REQUIRED` 또는 `NOT_IN_SERVICE_AREA`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: '`QUOTE_LIMIT_REACHED` 또는 `REQUEST_NOT_PENDING`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/{requestId}/rejections':
    post:
      tags: [MoverInbox]
      summary: 견적 요청 반려 (기사님)
      operationId: rejectMoveRequest
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      description: 지역에 관계없이 받은 요청을 반려합니다(§8.3). 반려 사유 입력은 요구하지 않습니다.
      responses:
        '201':
          description: 반려 완료. 해당 요청은 받은 요청 목록에서 사라집니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/RejectedRequest' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/me/received-requests':
    get:
      tags: [MoverInbox]
      summary: 받은 요청 목록 (기사님)
      description: |-
        기본적으로 모든 서비스 지역의 받은 요청을 반환합니다(§8.1). 지정 요청도 포함합니다.
        지정 여부를 구분하여 강조 표시할 수 있습니다. 이사 유형·지역·지정 여부 필터와
        이사 빠른 순·최근 요청 순 정렬을 지원합니다. 지역 단위와 매핑 방식은 추후 결정합니다.
      operationId: listReceivedRequests
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - name: moveTypes
          in: query
          description: 이사 유형 (OR). 생략하면 전체.
          style: form
          explode: false
          schema:
            type: array
            items: { '$ref': '#/components/schemas/ServiceType' }
        - name: region
          in: query
          description: 요청 지역으로 필터링. 생략하면 모든 서비스 지역.
          schema: { '$ref': '#/components/schemas/Region' }
        - name: designatedOnly
          in: query
          description: 지정 견적 요청만
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { '$ref': '#/components/schemas/ReceivedRequestSort' }
        - { '$ref': '#/components/parameters/Cursor' }
        - { '$ref': '#/components/parameters/Limit' }
      responses:
        '200':
          description: 받은 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/ReceivedRequestListResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/quotes':
    get:
      tags: [MoverInbox]
      summary: 보낸 견적 목록 조회 (기사님)
      description: |-
        로그인한 기사님이 본인이 보낸 견적을 최신순으로 조회합니다.
        견적 상태별 필터링과 커서 기반 페이지네이션을 지원합니다.
        고객명은 닉네임을 우선 사용하며, 닉네임이 없으면 사용자 이름을 반환합니다.
      operationId: listMySentQuotes
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - name: status
          in: query
          description: 견적 상태 필터. 생략하면 전체 조회.
          required: false
          schema:
            '$ref': '#/components/schemas/QuoteStatus'
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          description: 페이지당 조회 개수. 생략하면 10.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 보낸 견적 목록 페이지. 견적이 없으면 빈 배열을 반환합니다.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SentQuoteListResponse'
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/rejected-requests':
    get:
      tags: [MoverInbox]
      summary: 반려한 요청 목록
      operationId: listMyRejectedRequests
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
        - { '$ref': '#/components/parameters/Limit' }
      responses:
        '200':
          description: 반려한 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/RejectedRequestListResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/quotes/{quoteId}':
    get:
      tags: [Quotes]
      summary: 견적 상세
      description: 견적 요청자 본인이 견적가와 기사님 정보를 조회합니다.
      operationId: getQuote
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 견적 상세
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/QuoteDetail' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
      x-roles: [CUSTOMER]
  '/quotes/{quoteId}/confirm':
    post:
      tags: [Quotes]
      summary: 견적 확정
      description: |-
        호출자 본인의 견적 요청에서 견적 하나를 확정합니다. 요청당 확정 견적은 하나이며,
        요청 상태와 견적 상태는 함께 갱신합니다. 기사님과 일반 유저에게 확정 알림을 보냅니다.
      operationId: confirmQuote
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/QuoteDetail' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: '`REQUEST_NOT_PENDING` (이미 확정되었거나 만료됨)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/reviews':
    post:
      tags: [Reviews]
      summary: 리뷰 작성
      description:
        호출자 본인의 완료된 이사에서 확정된 견적의 기사님에게 리뷰를 작성합니다(§11.1). 완료 판정 방식과 리뷰 중복 정책은
        추후 결정하며, 다음 날까지 기다려야 한다는 별도 제한은 두지 않습니다.
      operationId: createReview
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MyReview' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`, `PROFILE_REQUIRED` 또는 `REVIEW_NOT_ALLOWED`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/customers/me/reviews':
    get:
      tags: [Reviews]
      summary: 내가 작성한 리뷰
      operationId: listMyReviews
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 목록 페이지
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MyReviewListResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/customers/me/reviews/writable':
    get:
      tags: [Reviews]
      summary: 작성 가능한 리뷰 목록
      operationId: listWritableReviews
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 작성 대기 중인 확정 견적 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/WritableReviewListResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/notifications':
    get:
      tags: [Notifications]
      summary: 미읽음 알림 목록 조회
      description: 현재 사용자의 미읽음 알림을 최신순으로 3개씩 조회합니다.
      operationId: listNotifications
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
      responses:
        '200':
          description: 미읽음 알림 목록
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/NotificationListResponse' }
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/unread-count':
    get:
      tags: [Notifications]
      summary: 미읽음 알림 개수 조회
      operationId: getUnreadNotificationCount
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 미읽음 알림 개수
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount]
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/read-all':
    patch:
      tags: [Notifications]
      summary: 전체 알림 읽음 처리
      operationId: readAllNotifications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 전체 알림 읽음 처리 결과
          content:
            application/json:
              schema:
                type: object
                required: [updatedCount]
                properties:
                  updatedCount:
                    type: integer
                    minimum: 0
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/{id}/read':
    patch:
      tags: [Notifications]
      summary: 개별 알림 읽음 처리
      operationId: readNotification
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 개별 알림 읽음 처리 결과
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: boolean
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: moving.sid
      description: express-session에서 발급한 세션 쿠키
  parameters:
    ProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, kakao, naver]
    MoverIdPath:
      name: moverId
      in: path
      required: true
      description: 기사님의 user id
      schema: { type: string, format: uuid }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuoteIdPath:
      name: quoteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: 이전 페이지의 `nextCursor`. 첫 페이지에서는 생략합니다.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      description: 페이지 번호. 생략하면 1
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 페이지당 개수. 생략하면 10
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`. `details`에 유효하지 않은 필드별 정보가 담깁니다.'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: 잘못된 요청입니다
              details:
                - field: password
                  reason:
                    must be at least 8 characters and include a letter, a number,
                    and a special character
    Unauthorized:
      description: 인증 정보가 없거나 유효하지 않음
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    InvalidSession:
      description: '`UNAUTHORIZED`. 만료되었거나 유효하지 않은 세션 쿠키를 보낸 경우. 응답에서 쿠키를 지우므로 다시 요청하면 비회원으로 조회됩니다.'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    Forbidden:
      description:
        '`FORBIDDEN` (역할이 다르거나 본인 소유가 아님) 또는 `PROFILE_REQUIRED` (사용자를 프로필
        등록 화면으로 이동)'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
  schemas:
    Role:
      type: string
      enum: [CUSTOMER, MOVER]
    ServiceType:
      type: string
      description: SMALL 소형이사, HOME 가정이사, OFFICE 사무실이사
      enum: [SMALL, HOME, OFFICE]
    Region:
      {
        type: string,
        description:
          '시/도 줄임 명칭: 서울, 경기, 인천, 강원, 충북, 충남, 세종, 대전, 전북, 전남, 광주, 경북, 경남, 대구, 울산, 부산,
          제주',
      }
    MoveRequestStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, EXPIRED]
    QuoteStatus:
      type: string
      enum: [SUBMITTED, CONFIRMED, NOT_SELECTED]
    NotificationType:
      type: string
      enum:
        [
          NEW_REQUEST,
          NEW_DESIGNATED_REQUEST,
          NEW_QUOTE,
          QUOTE_CONFIRMED,
          MOVE_DAY,
        ]
    MoverSort:
      type: string
      description:
        리뷰 많은 순 / 평점 높은 순 / 경력 많은 순 / 확정 많은 순. 값이 같으면 기사님 id 순서이며,
        경력순에서는 경력을 입력하지 않은 기사님이 마지막에 옵니다.
      enum: [REVIEW_COUNT, RATING, CAREER, CONFIRMED_COUNT]
    ReceivedRequestSort:
      type: string
      description: 이사 빠른 순 / 최근 요청 순
      enum: [MOVE_DATE_ASC, CREATED_DESC]
    ErrorCode:
      type: string
      description: 주요 오류 코드 초안. 세부 오류 분류와 메시지는 구현 시 결정합니다.
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - EMAIL_ALREADY_EXISTS
        - FORBIDDEN
        - PROFILE_REQUIRED
        - NOT_IN_SERVICE_AREA
        - REVIEW_NOT_ALLOWED
        - NOT_FOUND
        - PROFILE_ALREADY_EXISTS
        - ACTIVE_REQUEST_EXISTS
        - ALREADY_DESIGNATED
        - MOVER_ALREADY_RESPONDED
        - DESIGNATION_LIMIT_REACHED
        - REQUEST_NOT_PENDING
        - QUOTE_LIMIT_REACHED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - SOCIAL_LOGIN_FAILED
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { '$ref': '#/components/schemas/ErrorCode' }
            message:
              {
                type: string,
                description:
                  오류 안내. 운영 환경에서는 스택 트레이스 등 내부 상세 정보를
                  노출하지 않습니다.,
              }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
    CursorMeta:
      type: object
      required: [nextCursor, hasNext]
      properties:
        nextCursor: { type: string, nullable: true }
        hasNext: { type: boolean }
    OffsetMeta:
      type: object
      required: [page, pageSize, totalCount, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
    UploadResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    SignupRequest:
      type: object
      required: [role, name, email, phone, password]
      properties:
        role: { '$ref': '#/components/schemas/Role' }
        name:
          type: string
          minLength: 2
          maxLength: 20
          description: 앞뒤 공백 제거 후 2~20자
        email: { type: string, format: email }
        phone:
          {
            type: string,
            description: 지역에 맞는 전화번호 형식을 검증합니다(§3.2.1).,
          }
        password:
          {
            type: string,
            format: password,
            description: '공백을 제외한 ASCII 문자 8~16자. 영문·숫자·특수문자를 각각 1자 이상 포함',
            minLength: 8,
            maxLength: 16,
          }
    LoginRequest:
      type: object
      required: [role, email, password]
      properties:
        role: { '$ref': '#/components/schemas/Role' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { '$ref': '#/components/schemas/Me' }
    Me:
      type: object
      required:
        [
          id,
          role,
          name,
          email,
          phone,
          hasProfile,
          customerProfile,
          moverProfile,
        ]
      properties:
        id: { type: string, format: uuid }
        role: { '$ref': '#/components/schemas/Role' }
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        hasProfile: { type: boolean }
        customerProfile:
          description: role이 CUSTOMER이고 프로필이 있을 때 채워짐
          type: object
          nullable: true
          allOf:
            - { '$ref': '#/components/schemas/CustomerProfile' }
        moverProfile:
          description: role이 MOVER이고 프로필이 있을 때 채워짐
          type: object
          nullable: true
          allOf:
            - { '$ref': '#/components/schemas/MoverProfile' }
    BasicInfoUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, description: 지역에 맞는 전화번호 형식 }
    CustomerProfile:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명, nullable: true }
        careerYears: { type: integer, description: 경력 (년), nullable: true }
        intro: { type: string, description: 한 줄 소개, nullable: true }
        description: { type: string, description: 상세 설명, nullable: true }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
          nullable: true
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
          nullable: true
    CustomerProfileCreate:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명 }
        careerYears: { type: integer, description: 경력 (년) }
        intro: { type: string, description: 한 줄 소개 }
        description: { type: string, description: 상세 설명 }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
    CustomerProfileUpdate:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명 }
        careerYears: { type: integer, description: 경력 (년) }
        intro: { type: string, description: 한 줄 소개 }
        description: { type: string, description: 상세 설명 }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
    MoverProfile:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명, nullable: true }
        careerYears: { type: integer, description: 경력 (년), nullable: true }
        intro: { type: string, description: 한 줄 소개, nullable: true }
        description: { type: string, description: 상세 설명, nullable: true }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
          nullable: true
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
          nullable: true
    MoverProfileCreate:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명 }
        careerYears: { type: integer, description: 경력 (년) }
        intro: { type: string, description: 한 줄 소개 }
        description: { type: string, description: 상세 설명 }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
    MoverProfileUpdate:
      type: object
      description: '§3.4의 프로필 항목. 필수 입력 여부는 추후 결정합니다.'
      properties:
        imageUrl: { type: string, format: uri, nullable: true }
        nickname: { type: string, description: 별명 }
        careerYears: { type: integer, description: 경력 (년) }
        intro: { type: string, description: 한 줄 소개 }
        description: { type: string, description: 상세 설명 }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
        regions:
          type: array
          items: { '$ref': '#/components/schemas/Region' }
    MoverSummary:
      description: 기사님 목록, 찜 목록, 견적 카드, 리뷰에서 재사용하는 카드 형태
      type: object
      required:
        [
          id,
          nickname,
          imageUrl,
          intro,
          careerYears,
          serviceTypes,
          averageRating,
          reviewCount,
          confirmedCount,
          isFavorite,
        ]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, nullable: true }
        imageUrl: { type: string, format: uri, nullable: true }
        intro: { type: string, nullable: true }
        careerYears: { type: integer, nullable: true }
        serviceTypes:
          type: array
          items: { '$ref': '#/components/schemas/ServiceType' }
          nullable: true
        averageRating:
          { type: number, format: float, example: 4.8, description: 평균 평점
              (소수점 둘째 자리까지). 리뷰가 없으면 0. 평점은 1~5점 정수입니다. }
        reviewCount: { type: integer }
        confirmedCount: { type: integer }
        isFavorite:
          {
            type: boolean,
            nullable: true,
            description: 로그인한 일반 유저가 아니면 null,
          }
    MoverDetail:
      allOf:
        - { '$ref': '#/components/schemas/MoverSummary' }
        - type: object
          required: [description, regions, ratingCounts, isDesignated]
          properties:
            description: { type: string, nullable: true }
            regions:
              type: array
              items: { '$ref': '#/components/schemas/Region' }
              nullable: true
            ratingCounts:
              type: object
              description: 1~5점별 리뷰 수. 리뷰가 없는 점수는 0입니다.
              required: ['1', '2', '3', '4', '5']
              properties:
                '1': { type: integer }
                '2': { type: integer }
                '3': { type: integer }
                '4': { type: integer }
                '5': { type: integer }
            isDesignated:
              {
                type: boolean,
                nullable: true,
                description: 활성 견적 요청이 있는
                  일반 유저가 아니면 null,
              }
    MoverListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/MoverSummary' }
    FavoriteListResponse:
      allOf:
        - { '$ref': '#/components/schemas/MoverListResponse' }
        - type: object
          required: [totalCount]
          properties:
            totalCount: { type: integer, description: 찜한 기사님 전체 수 }
    FavoriteState:
      type: object
      required: [moverId, isFavorite, favoriteCount]
      properties:
        moverId: { type: string, format: uuid }
        isFavorite: { type: boolean }
        favoriteCount: { type: integer, description: 기사님이 받은 전체 찜 수 }
    FavoriteRemoveRequest:
      oneOf:
        - type: object
          title: 선택한 기사님 해제
          required: [moverIds]
          additionalProperties: false
          properties:
            all:
              { type: boolean, enum: [false], description: 생략할 수 있습니다 }
            moverIds:
              type: array
              description: 해제할 기사님의 user id. 중복은 한 번만 처리합니다.
              minItems: 1
              maxItems: 500
              items: { type: string, format: uuid }
        - type: object
          title: 전체 해제
          required: [all]
          additionalProperties: false
          properties:
            all:
              {
                type: boolean,
                enum: [true],
                description: 본인의 찜을 모두 해제합니다,
              }
    FavoriteRemoveResult:
      type: object
      required: [removedCount]
      properties:
        removedCount:
          { type: integer, description: 이번 요청으로 실제 해제된 찜 수 }
    AddressInput:
      type: object
      description: 우편번호 서비스로 입력한 주소. 제공자는 특정하지 않으며, 지역은 서버가 주소로 판별합니다.
      required: [address]
      properties:
        address:
          type: string
          maxLength: 200
          description: 시/도로 시작하는 주소
          example: 서울 강남구 테헤란로 152
        zonecode: { type: string, pattern: '^\d{5}$', description: 우편번호 }
    Address:
      type: object
      required: [address, region]
      properties:
        address: { type: string }
        zonecode: { type: string, nullable: true }
        region: { '$ref': '#/components/schemas/Region' }
    MoveRequestCreate:
      type: object
      required: [moveType, moveDate, from, to]
      properties:
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate:
          {
            type: string,
            format: date,
            description: 이사 날짜. 한국 시간 기준 오늘 또는 이후,
          }
        from: { '$ref': '#/components/schemas/AddressInput' }
        to: { '$ref': '#/components/schemas/AddressInput' }
    MoveRequest:
      type: object
      required:
        [
          id,
          moveType,
          moveDate,
          from,
          to,
          status,
          quoteCount,
          designatedMoverIds,
          createdAt,
          confirmedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        from: { '$ref': '#/components/schemas/Address' }
        to: { '$ref': '#/components/schemas/Address' }
        status: { '$ref': '#/components/schemas/MoveRequestStatus' }
        quoteCount: { type: integer, maximum: 8 }
        designatedMoverIds:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
    MoveRequestWithQuotes:
      allOf:
        - { '$ref': '#/components/schemas/MoveRequest' }
        - type: object
          required: [quotes]
          properties:
            quotes:
              type: array
              maxItems: 8
              items: { '$ref': '#/components/schemas/CustomerQuote' }
    MoveRequestHistoryResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/MoveRequestWithQuotes' }
    DesignationCreate:
      type: object
      required: [moverId]
      properties:
        moverId: { type: string, format: uuid }
    Designation:
      type: object
      required: [moveRequestId, moverId, createdAt]
      properties:
        moveRequestId: { type: string, format: uuid }
        moverId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CustomerQuote:
      description: 견적을 요청한 일반 유저에게 보이는 견적
      type: object
      required: [id, price, status, isDesignated, createdAt, mover]
      properties:
        id: { type: string, format: uuid }
        price: { type: integer, description: 원(KRW), example: 350000 }
        status: { '$ref': '#/components/schemas/QuoteStatus' }
        isDesignated: { type: boolean, description: 지정 견적 라벨 표시용 }
        createdAt: { type: string, format: date-time }
        mover: { '$ref': '#/components/schemas/MoverSummary' }
    QuoteDetail:
      allOf:
        - { '$ref': '#/components/schemas/CustomerQuote' }
        - type: object
          required: [confirmedAt, moveRequest]
          properties:
            confirmedAt: { type: string, format: date-time, nullable: true }
            moveRequest: { '$ref': '#/components/schemas/MoveRequest' }
    QuoteCreate:
      type: object
      required: [price]
      properties:
        price: { type: integer, description: 견적가 (원) }
    RequestForMover:
      description: 기사님에게 보이는 견적 요청
      type: object
      required:
        [
          id,
          customerName,
          moveType,
          moveDate,
          from,
          to,
          status,
          isDesignated,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        customerName: { type: string, nullable: true }
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        from: { '$ref': '#/components/schemas/Address' }
        to: { '$ref': '#/components/schemas/Address' }
        status: { '$ref': '#/components/schemas/MoveRequestStatus' }
        isDesignated: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReceivedRequestListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/RequestForMover' }
    SentQuote:
      description: 견적을 보낸 기사님에게 보이는 견적
      type: object
      required: [id, price, status, isDesignated, createdAt, moveRequest]
      properties:
        id: { type: string, format: uuid }
        price: { type: integer }
        status: { '$ref': '#/components/schemas/QuoteStatus' }
        isDesignated: { type: boolean }
        createdAt: { type: string, format: date-time }
        moveRequest: { '$ref': '#/components/schemas/RequestForMover' }
    SentQuoteListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/SentQuote' }
    RejectedRequest:
      type: object
      required: [moveRequest, rejectedAt]
      properties:
        moveRequest: { '$ref': '#/components/schemas/RequestForMover' }
        rejectedAt: { type: string, format: date-time }
    RejectedRequestListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/RejectedRequest' }
    ReviewCreate:
      type: object
      required: [quoteId, rating, content]
      properties:
        quoteId: { type: string, format: uuid }
        rating: { type: integer, description: 평점 (1~5점) }
        content: { type: string }
    Review:
      description: 기사님 페이지에 표시되는 리뷰
      type: object
      required: [id, rating, content, customerName, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, description: 평점 (1~5점) }
        content: { type: string }
        customerName:
          {
            type: string,
            description: '리뷰 작성자 이름. 첫 글자만 남기고 `*`로 가리며 이름이 없으면 null',
            nullable: true,
          }
        createdAt: { type: string, format: date-time }
    MoverReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/Review' }
    ReviewTarget:
      description: 리뷰 대상인(또는 리뷰할 수 있는) 완료된 이사
      type: object
      required: [quoteId, price, isDesignated, moveType, moveDate, mover]
      properties:
        quoteId: { type: string, format: uuid }
        price: { type: integer }
        isDesignated: { type: boolean }
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        mover: { '$ref': '#/components/schemas/MoverSummary' }
    MyReview:
      allOf:
        - { '$ref': '#/components/schemas/ReviewTarget' }
        - type: object
          required: [id, rating, content, createdAt]
          properties:
            id: { type: string, format: uuid }
            rating: { type: integer, description: 평점 (1~5점) }
            content: { type: string }
            createdAt: { type: string, format: date-time }
    MyReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/MyReview' }
    WritableReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/ReviewTarget' }
    Notification:
      type: object
      required: [id, userId, type, payload, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { '$ref': '#/components/schemas/NotificationType' }
        message: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        moveRequestId: { type: string, format: uuid, nullable: true }
        quoteId: { type: string, format: uuid, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/Notification' }
