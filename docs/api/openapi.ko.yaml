              items: { '$ref': '#/components/schemas/Region' }
              nullable: true
            ratingCounts:
              type: object
              description: 1~5점별 리뷰 수. 리뷰가 없는 점수는 0입니다.
              required: ['1', '2', '3', '4', '5']
              properties:
                '1': { type: integer }
                '2': { type: integer }
                '3': { type: integer }
                '4': { type: integer }
                '5': { type: integer }
            isDesignated:
              {
                type: boolean,
                nullable: true,
                description: 활성 견적 요청이 있는
                  일반 유저가 아니면 null,
              }
