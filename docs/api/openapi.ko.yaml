          VANITY,
          SHOE_CABINET,
          TV_STAND,
          FRIDGE_SMALL,
          FRIDGE_STANDARD,
          FRIDGE_SIDE_BY_SIDE,
          FRIDGE_FOUR_DOOR,
          KIMCHI_FRIDGE,
          WASHER_DRUM,
          WASHER_TOP_LOAD,
          DRYER,
          AIRCON_WALL,
          AIRCON_STAND,
          TV,
          COMPUTER,
          MICROWAVE,
          CLOTHES_CARE,
          WATER_PURIFIER,
          AIR_PURIFIER,
          MASSAGE_CHAIR,
          PIANO,
          BICYCLE,
          EXERCISE_EQUIPMENT,
          PLANT,
          SUITCASE,
          CAT_TOWER,
          MIRROR,
        ]
    Building:
      description: 출발지 또는 도착지 건물 환경
      type: object
      required: [buildingType, floor, hasElevator, canPark]
      properties:
        buildingType: { '$ref': '#/components/schemas/BuildingType' }
