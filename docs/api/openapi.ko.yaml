---
openapi: 3.0.3
info:
  title: 무빙 (Moving) API
  version: 0.1.0
  description: |
    이사 소비자(CUSTOMER)와 이사 전문가(MOVER, 기사님) 매칭 서비스의 초기 API 초안.

    모든 응답은 요청마다 새로 발급한 `Request-ID` 헤더를 포함합니다. 서버 로그의 `req.id`와 같은 값입니다.

servers:
  - { url: '/api' }
tags:
  - { name: Auth }
  - { name: Me }
  - { name: Profiles }
  - { name: Uploads }
  - { name: Movers }
  - { name: Favorites }
  - { name: MoveRequests }
  - { name: MoverInbox }
  - { name: Quotes }
  - { name: Reviews }
  - { name: Notifications }
  - { name: Chat }
paths:
  '/auth/signup':
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      description: 요청한 역할의 이메일 계정을 생성하고 로그인 세션을 발급합니다. 이름·이메일·전화번호·비밀번호는 validator 기준에 따라 검증합니다.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/Me'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '409':
          description: '`EMAIL_ALREADY_EXISTS`. 같은 역할로 이미 가입된 이메일인 경우'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
        '429':
          '$ref': '#/components/responses/RateLimited'
  '/auth/login':
    post:
      tags: [Auth]
      summary: 이메일 로그인
      description: 역할별 로그인 페이지에서 요청한 역할과 이메일·비밀번호를 확인하고 사용자 정보를 반환합니다.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/AuthResponse'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          description: '`INVALID_CREDENTIALS`'
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
        '429':
          '$ref': '#/components/responses/RateLimited'
  '/auth/{provider}':
    get:
      tags: [Auth]
      summary: 소셜 로그인 시작 (provider로 리다이렉트)
      description: |
        선택한 소셜 제공자(Google / Kakao / Naver) 인가 페이지로 이동합니다.
        `role`은 OAuth `state`에 서명되어 콜백에서 복원됩니다.
        제공자 앱 Client ID/Secret과 Redirect URI 환경 변수가 필요합니다.
      operationId: startSocialLogin
      security: []
      parameters:
        - { '$ref': '#/components/parameters/ProviderPath' }
        - name: role
          in: query
          required: true
          schema: { '$ref': '#/components/schemas/Role' }
      responses:
        '200': { description: OAuth 인증 요청 안내 }
        '302':
          {
            description: Google / Kakao / Naver 인가(authorize) URL로 리다이렉트,
          }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401':
          description: '`SOCIAL_LOGIN_FAILED` (OAuth 설정 누락 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/auth/{provider}/callback':
    get:
      tags: [Auth]
      summary: 소셜 로그인 콜백 (등록된 redirect URI)
      description: 소셜 제공자의 응답을 검증한 뒤 가입 또는 로그인합니다.
      operationId: socialLoginCallback
      security: []
      parameters:
        - { '$ref': '#/components/parameters/ProviderPath' }
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 로그인 결과 화면으로 이동
          headers:
            Location:
              description: 로그인 결과에 따른 프론트엔드 이동 URL
              schema:
                type: string
        '400':
          description: 잘못된 OAuth 요청 또는 인증 실패
        '401':
          description: OAuth 인증 실패
        '500':
          description: 서버 내부 오류
  '/auth/logout':
    post:
      tags: [Auth]
      summary: 로그아웃
      description: 현재 로그인된 세션을 종료하고 세션 쿠키를 삭제합니다.
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: 로그아웃되었습니다.
        '401':
          description: 인증되지 않은 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 로그아웃 처리 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/users/me':
    get:
      tags: [Me]
      summary: 내 정보 (GNB, 라우트 가드용)
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Me' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      summary: 기본 정보 수정
      description: 일반 유저 정보 수정과 기사님 기본정보 수정에서 사용합니다. 변경 가능 항목과 인증 확인 방식은 추후 결정합니다.
      operationId: updateMe
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/BasicInfoUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Me' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
  '/users/me/password':
    patch:
      tags: [Me]
      summary: 비밀번호 변경
      description: 이메일 계정의 비밀번호를 변경합니다. 소셜 로그인 전용 계정은 변경할 수 없습니다.
      operationId: changePassword
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/PasswordChange' }
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: 비밀번호가 변경되었습니다
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401':
          description: '`UNAUTHORIZED` 또는 `INVALID_CREDENTIALS`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '403':
          description: '`FORBIDDEN`. 비밀번호가 없는 소셜 계정'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/customers/me/profile':
    post:
      tags: [Profiles]
      summary: 일반 유저 프로필 등록
      operationId: createCustomerProfile
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomerProfileCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/CustomerProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`PROFILE_ALREADY_EXISTS`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Profiles]
      summary: 일반 유저 프로필 수정
      operationId: updateCustomerProfile
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomerProfileUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/CustomerProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/profile':
    post:
      tags: [Profiles]
      summary: 기사님 프로필 등록
      operationId: createMoverProfile
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoverProfileCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`PROFILE_ALREADY_EXISTS`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Profiles]
      summary: 기사님 프로필 수정
      operationId: updateMoverProfile
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoverProfileUpdate' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverProfile' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me':
    get:
      tags: [Profiles]
      summary: 기사님 마이페이지 (내 프로필·평점)
      operationId: getMyMoverPage
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      responses:
        '200':
          description: 기사님 본인의 프로필·평점·진행 중인 이사 건수. isFavorite과 isDesignated는 null입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverMyPage' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/uploads/images':
    post:
      tags: [Uploads]
      summary: 프로필 이미지 업로드
      description: JPG·PNG·WEBP 이미지 한 장(5MB 이하, 1,300만 화소 이하)을 받아 방향을 바로잡고 EXIF(위치 정보 포함) 등 메타데이터를 지운 뒤, 같은 형식으로 S3에 저장하고 프로필 등록·수정의 imageUrl에 넣을 URL을 반환합니다. 형식은 보낸 Content-Type이 아니라 파일 내용으로 확인하며, `file` 외 다른 필드는 받지 않습니다. 형식·용량·화소 초과, 파일 누락, 손상된 이미지 오류는 400 `details`의 `file` 필드로 알려 줍니다.
      operationId: uploadImage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 업로드 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/UploadResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '503':
          description: '`UPLOAD_NOT_CONFIGURED`. 서버에 `AWS_REGION`·`S3_BUCKET`·`IMAGE_BASE_URL` 중 하나라도 없는 경우 (로컬 개발 환경 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/movers':
    get:
      tags: [Movers]
      summary: 기사님 목록 (검색·정렬·필터·무한 스크롤)
      description: |
        공개 API. 로그인한 일반 유저가 호출하면 `isFavorite`가 채워지고, 그 외에는 null입니다.
        프로필을 등록한 기사님만 목록에 노출됩니다.
        검색어와 필터는 함께 적용되며, 다음 페이지를 요청할 때는 첫 페이지와 같은 조건에 `cursor`를 더해 보냅니다.
      operationId: listMovers
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: keyword
          in: query
          description: 기사님 별명, 한 줄 소개 또는 상세 설명 부분 검색 (대소문자 구분 없음). 앞뒤 공백은 제거하며, 빈 값이면 적용하지 않습니다.
          schema: { type: string }
        - name: region
          in: query
          description: 서비스 지역에 이 지역이 포함된 기사님만 조회합니다. 빈 값이면 적용하지 않습니다.
          schema: { '$ref': '#/components/schemas/Region' }
        - name: serviceType
          in: query
          description: 이 서비스를 제공하는 기사님만 조회합니다.
          schema: { '$ref': '#/components/schemas/ServiceType' }
        - name: sort
          in: query
          description: 생략하면 `REVIEW_COUNT`
          schema: { '$ref': '#/components/schemas/MoverSort' }
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 기사님 목록 페이지. 조건에 맞는 기사님이 없으면 `items`는 빈 배열, `nextCursor`는 null, `hasNext`는 false입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverListResponse' }
        '400':
          description: '`VALIDATION_ERROR`. `sort`·`serviceType`·`limit`이 허용 범위를 벗어나거나, `cursor`가 잘못된 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/InvalidSession' }
  '/movers/{moverId}':
    get:
      tags: [Movers]
      summary: 기사님 상세 (SNS 공유 링크 대상)
      description: |
        공개 API. 로그인한 일반 유저라면 `isFavorite`가 채워지고, `isDesignated`는 이 기사님이
        해당 유저의 활성 견적 요청에 이미 지정되어 있는지를 나타냅니다.
        `ratingCounts`는 1~5점별 리뷰 수입니다. 프로필을 등록한 기사님만 조회됩니다 (404).
      operationId: getMover
      security:
        - {}
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 기사님 상세
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverDetail' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/InvalidSession' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/{moverId}/reviews':
    get:
      tags: [Movers, Reviews]
      summary: 기사님이 받은 리뷰 (페이지네이션)
      description: |
        공개 API. 기사님 본인 마이페이지에서도 사용합니다.
        최근에 작성된 리뷰부터 보여주며, 작성자 이름은 첫 글자만 남기고 `*`로 가립니다.
      operationId: listMoverReviews
      security: []
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 목록 페이지. 리뷰가 없으면 `items`는 빈 배열, `totalCount`와 `totalPages`는 0입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoverReviewListResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/{moverId}/review-summary':
    get:
      tags: [Movers, Reviews]
      summary: 기사님 리뷰 AI 요약
      description: |
        공개 API. 리뷰가 10건 미만이면 `null`을 반환합니다.
        현재 리뷰 수가 요약 생성 당시와 같으면 저장된 요약을 반환합니다.
        요약이 없거나 리뷰 수가 달라지면 요약 생성 작업을 큐에 등록합니다.
        생성 완료를 기다리지 않고 기존 요약을 반환하며, 저장된 요약이 없으면 `null`을 반환합니다.
        큐 등록에 실패한 경우에도 기존 요약 또는 `null`을 반환합니다.
      operationId: getMoverReviewSummary
      security: []
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 리뷰 요약. 없으면 null
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/MoverReviewSummary'
        '400': { '$ref': '#/components/responses/ValidationError' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/{moverId}/favorite':
    put:
      tags: [Favorites]
      summary: 찜하기 (멱등)
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 이미 찜한 기사님이면 그대로 두고 현재 상태를 반환합니다.
        프로필을 등록하지 않은 기사님은 찜할 수 없습니다 (404).
      operationId: addFavorite
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 찜한 상태와 기사님의 전체 찜 수
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteState' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
    delete:
      tags: [Favorites]
      summary: 찜 해제 (멱등)
      description: 찜하지 않은 기사님이면 그대로 두고 현재 상태를 반환합니다. 그 외 조건은 찜하기와 같습니다.
      operationId: removeFavorite
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/MoverIdPath' }
      responses:
        '200':
          description: 찜 해제된 상태와 기사님의 전체 찜 수
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteState' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/customers/me/favorites':
    get:
      tags: [Favorites]
      summary: 찜한 기사님 목록
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 최근에 찜한 기사님부터 보여주며, 찜을 취소한 기사님은 빠집니다.
        PC 사이드바에서는 `limit=3`으로 최대 3명을 표시할 수 있습니다. 다음 페이지를 요청할 때는 `cursor`를 더해 보내며, 그 사이에 찜을 취소했더라도 이어서 조회됩니다.
      operationId: listMyFavorites
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: 찜한 기사님 목록 페이지 (`isFavorite`는 항상 true, `totalCount`는 찜한 기사님 전체 수). 찜한 기사님이 없으면 `items`는 빈 배열, `totalCount`는 0, `nextCursor`는 null, `hasNext`는 false입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteListResponse' }
        '400':
          description: '`VALIDATION_ERROR`. `limit`이 허용 범위를 벗어나거나 `cursor`가 잘못된 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
    delete:
      tags: [Favorites]
      summary: 찜 일괄 해제 (멱등)
      description: |
        프로필을 등록한 일반 유저만 호출할 수 있습니다. 찜한 기사님 페이지의 선택 항목 삭제에 씁니다.
        화면에서 선택한 기사님의 id를 `moverIds`로 보내면 그 기사님들만 해제합니다. 전체 선택도 화면에 보이는 기사님만 선택하므로 같은 방식으로 보냅니다.
        `all: true`를 보내면 본인의 찜을 모두 해제합니다. 찜하지 않았거나 없는 기사님과 중복된 id는 건너뛰고 실제 해제된 수를 반환하며, `moverIds`는 한 번에 최대 500개입니다.
      operationId: removeMyFavorites
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/FavoriteRemoveRequest' }
            examples:
              selected:
                summary: 선택한 기사님 해제
                value:
                  moverIds:
                    - 11111111-1111-4111-8111-111111111111
                    - 22222222-2222-4222-8222-222222222222
              all:
                summary: 전체 해제
                value: { all: true }
      responses:
        '200':
          description: 이번 요청으로 실제 해제된 찜 수. 해제된 찜이 없으면 0입니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/FavoriteRemoveResult' }
        '400':
          description: '`VALIDATION_ERROR`. `moverIds`가 없거나 비어 있거나, 500개를 넘거나, uuid가 아닌 값이 있거나, `all: true`와 `moverIds`를 함께 보낸 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests':
    post:
      tags: [MoveRequests]
      summary: 일반 견적 요청 생성
      description: |-
        §4.2에 따라 이사일이 지나기 전에는 새 요청을 만들 수 없으며 활성 요청은 한 번에 하나입니다.
        활성 요청은 상태가 `PENDING`, `CONFIRMED`, `COMPLETED` 중 하나이고 이사일이 지나지 않은 요청입니다.
        서버는 요청 상태와 이사일을 함께 확인하며, 이사일이 지난 요청은 새 요청을 만들 때 `EXPIRED` 또는 `COMPLETED`로 바꿉니다.
        이사 완료 처리만으로 이사일 이전에 새 요청을 허용하지 않습니다.
        날짜는 한국 시간(Asia/Seoul) 기준이며 오늘 날짜로도 요청할 수 있습니다.
        출발지와 도착지의 지역은 서버가 주소의 첫 단어(시/도)로 판별하며, 강원도, 전라북도, 제주도처럼 바뀌기 전 명칭과 줄임 명칭도 인식합니다.
        새 요청을 모든 서비스 지역의 기사님들에게 알립니다.
        입력 중 수정(§4.1.4)은 제출 전 프론트엔드 폼에서 처리합니다.
        `details`로 이사 방식, 출발지·도착지 환경, 집 규모, 짐 목록, 잔짐 양, 요청사항을 함께 저장할 수 있으며, 기사님에게 보이는 요청에도 같은 정보가 포함됩니다.
      operationId: createMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoveRequestCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveRequest' }
        '400':
          description:
            '`VALIDATION_ERROR`. 필수 정보가 없거나, 이사 날짜가 한국 시간 기준으로 지났거나, 주소에서 시/도를 판별할 수
            없거나, 상세 정보 값이 올바르지 않은 경우. 사무실이사가 아닌데 거주 인원이 없거나 같은 짐을 중복해서 보낸 경우도 포함합니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '409':
          description: '`ACTIVE_REQUEST_EXISTS`. 활성 요청이 이미 있는 경우. 여러 번 또는 동시에 제출해도 요청은 하나만 생성됩니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/active':
    get:
      tags: [MoveRequests]
      summary: 현재 활성 견적 요청 (없으면 null)
      description: |-
        §4.2.1의 활성 요청을 반환합니다. 활성 여부는 견적 요청 생성의 제한과 같은 기준으로 판단합니다.
        이사일이 지난 요청은 아직 `EXPIRED` 또는 `COMPLETED`로 바뀌지 않았어도 반환하지 않습니다.
      operationId: getActiveMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      responses:
        '200':
          description: 활성 견적 요청 또는 null
          content:
            application/json:
              schema:
                type: object
                required: [moveRequest]
                properties:
                  moveRequest:
                    type: object
                    nullable: true
                    allOf:
                      - { '$ref': '#/components/schemas/MoveRequest' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests/history':
    get:
      tags: [MoveRequests]
      summary: 받았던 견적 (지난 요청 + 받은 견적 전체)
      description: 완료된 이사의 정보와 받은 전체 견적을 반환합니다. 확정 견적 필터를 제공합니다.
      operationId: listMoveRequestHistory
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - name: confirmedOnly
          in: query
          description: 확정된 견적만 조회
          schema: { type: boolean }
        - { '$ref': '#/components/parameters/Cursor' }
        - { '$ref': '#/components/parameters/Limit' }
      responses:
        '200':
          description: 지난 견적 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/MoveRequestHistoryResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/move-requests/{requestId}':
    get:
      tags: [MoveRequests]
      summary: 견적 요청 상세 (요청자 본인)
      description: 이사일이 지났거나 종료된 요청도 조회할 수 있습니다. 다른 사용자의 요청은 없는 요청과 같이 404를 반환합니다.
      operationId: getMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      responses:
        '200':
          description: 견적 요청
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveRequest' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
    delete:
      tags: [MoveRequests]
      summary: 견적 요청 삭제
      description: |
        요청자 본인의 이사 요청만 삭제할 수 있습니다.
        견적이 한 건도 없는 요청만 삭제할 수 있으며,
        지정 요청, 반려 기록, 연결된 알림은 함께 삭제됩니다.
      operationId: deleteMoveRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      responses:
        '204':
          description: 삭제 완료. 응답 본문 없음.
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: '`REQUEST_HAS_QUOTES`. 이미 견적이 제출된 요청은 삭제할 수 없습니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/{requestId}/designations':
    post:
      tags: [MoveRequests]
      summary: 지정 견적 요청
      description: |-
        호출자 본인의 일반 견적 요청이 먼저 있어야 합니다(§6.5). 대기 중이고 이사일이 지나지 않은 요청에 기사님을 지정합니다.
        한 요청에 기사님을 최대 3명까지 지정할 수 있으며, 동시에 요청해도 인원과 중복 제한을 지킵니다(§7.1.1).
        이 요청에 이미 견적을 보냈거나 요청을 반려한 기사님은 지정할 수 없습니다.
        지정 요청은 기사님에게 라벨로 강조 표시하며, 기사님의 서비스 가능 지역과 관계없이 요청할 수 있습니다.
        지정된 기사님에게 지정 견적 요청 알림을 보내고, 같은 요청의 새 견적 요청 알림이 있으면 지정 알림으로 바꿉니다.
      operationId: designateMover
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/DesignationCreate' }
      responses:
        '201':
          description: 지정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Designation' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404':
          description:
            '`NOT_FOUND`. 요청이 없거나 다른 사용자의 요청인 경우. 기사님이 없는 경우에는 `details`에 `moverId`가
            담깁니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '409':
          description:
            '`REQUEST_NOT_PENDING` (확정되었거나 이사일이 지난 요청), `ALREADY_DESIGNATED` (이미 지정한 기사님),
            `MOVER_ALREADY_RESPONDED` (이미 견적을 보냈거나 요청을 반려한 기사님) 또는 `DESIGNATION_LIMIT_REACHED`
            (이미 3명을 지정함)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/{requestId}/quotes':
    get:
      tags: [MoveRequests]
      summary: 받은 견적 목록 (대기 중인 견적)
      description: 요청자 본인만 받은 견적을 조회할 수 있습니다.
        일반 견적은 최대 5건, 지정 견적은 최대 3건으로 총 8건까지 조회할 수 있습니다.
        지정 견적을 먼저 반환하며, 같은 유형에서는 최신 견적 순으로 정렬합니다.
        생성 시각이 동일하면 견적 ID 내림차순으로 정렬합니다.
        견적 금액, 지정 여부, 기사님 요약 정보 및 찜 상태를 제공합니다.
        status 쿼리로 견적 상태를 필터링할 수 있습니다.
        별도 페이지네이션은 제공하지 않습니다.
      operationId: listQuotesForRequest
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
        - name: status
          in: query
          schema: { '$ref': '#/components/schemas/QuoteStatus' }
      responses:
        '200':
          description: 견적 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 8
                    items: { '$ref': '#/components/schemas/CustomerQuote' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
    post:
      tags: [MoverInbox]
      summary: 견적 보내기 (기사님)
      description: |-
        로그인 세션으로 인증된 기사님만 요청할 수 있습니다. 비로그인은 401, 고객은 403을 반환합니다.
        기사님은 모든 서비스 지역의 받은 요청에 가격을 입력하여 견적을 보냅니다(§8.1–8.2).
        지정된 기사님도 지역 제한 없이 견적을 보낼 수 있습니다. 확정되거나 이사일이 지난 요청에는 견적을 보내지 않습니다.
        일반 견적 최대 5개, 지정 견적 최대 3개, 총 최대 8개를 동시 요청에서도 지킵니다(§7.1.1).
        지정 여부의 견적 분류 시점과 재응답 정책은 추후 결정합니다. 일반 유저에게 새 견적 알림을 보냅니다.
      operationId: sendQuote
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/QuoteCreate' }
      responses:
        '201':
          description: 전송 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/SentQuote' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`, `PROFILE_REQUIRED` 또는 `NOT_IN_SERVICE_AREA`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: '`QUOTE_LIMIT_REACHED` 또는 `REQUEST_NOT_PENDING`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/move-requests/{requestId}/rejections':
    post:
      tags: [MoverInbox]
      summary: 견적 요청 반려 (기사님)
      operationId: rejectMoveRequest
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/RequestIdPath' }
      description: |-
        로그인 세션으로 인증된 기사님만 요청할 수 있습니다. 비로그인은 401, 고객은 403을 반환합니다.
        지역에 관계없이 받은 요청을 반려합니다(§8.3).
        반려 사유는 선택 입력이며, 생략하거나 빈 문자열로 전달하면 사유 없이 반려합니다.
        이미 반려한 요청은 최초 반려 기록과 사유를 유지합니다.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  description: 선택적 반려 사유. 빈 문자열과 공백만 입력한 경우 null로 저장됩니다.
      responses:
        '201':
          description: 반려 완료. 해당 요청은 받은 요청 목록에서 사라집니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/RejectedRequest' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/me/received-requests':
    get:
      tags: [MoverInbox]
      summary: 받은 요청 목록 (기사님)
      description: |-
        기본적으로 모든 서비스 지역의 받은 요청을 반환합니다(§8.1). 지정 요청도 포함합니다.
        지정 여부를 구분하여 강조 표시할 수 있습니다. 이사 유형·지역·지정 여부 필터와
        이사 빠른 순·최근 요청 순 정렬을 지원합니다. 지역 단위와 매핑 방식은 추후 결정합니다.
      operationId: listReceivedRequests
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - name: moveTypes
          in: query
          description: 이사 유형 (OR). 생략하면 전체.
          style: form
          explode: false
          schema:
            type: array
            items: { '$ref': '#/components/schemas/ServiceType' }
        - name: region
          in: query
          description: 요청 지역으로 필터링. 생략하면 모든 서비스 지역.
          schema: { '$ref': '#/components/schemas/Region' }
        - name: designatedOnly
          in: query
          description: 지정 견적 요청만
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { '$ref': '#/components/schemas/ReceivedRequestSort' }
        - { '$ref': '#/components/parameters/Cursor' }
        - { '$ref': '#/components/parameters/Limit' }
      responses:
        '200':
          description: 받은 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/ReceivedRequestListResponse' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/quotes':
    get:
      tags: [MoverInbox]
      summary: 보낸 견적 목록 조회 (기사님)
      description: |-
        로그인한 기사님이 본인이 보낸 견적을 최신순으로 조회합니다.
        로그인 세션으로 인증하며, 비로그인은 401, 고객은 403을 반환합니다.
        견적 상태별 필터링과 커서 기반 페이지네이션을 지원합니다.
        고객명은 User.name을 사용하며, 이름이 없으면 null을 반환합니다.
      operationId: listMySentQuotes
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - name: status
          in: query
          description: 견적 상태 필터. 생략하면 전체 조회.
          required: false
          schema:
            '$ref': '#/components/schemas/QuoteStatus'
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          description: 페이지당 조회 개수. 생략하면 10.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 보낸 견적 목록 페이지. 견적이 없으면 빈 배열을 반환합니다.
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/SentQuoteListResponse'
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/movers/me/quotes/{quoteId}':
    get:
      tags: [MoverInbox]
      summary: 보낸 견적 상세 조회 (기사님)
      description: |-
        로그인한 기사님이 본인이 보낸 견적 하나를 조회합니다.
        다른 기사님이 보낸 견적이거나 없는 견적이면 404를 반환합니다.
      operationId: getMySentQuote
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 보낸 견적 상세
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/SentQuote' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/movers/me/rejections':
    get:
      tags: [MoverInbox]
      summary: 반려한 요청 목록
      description: |-
        로그인한 기사님이 본인이 반려한 이사 요청 목록을 조회합니다.
        반려 시각 최신순으로 정렬합니다.
        이사 요청의 상태가 변경되더라도 반려 이력은 목록에 유지됩니다.
        요청 상태에 따른 별도 필터링은 적용하지 않습니다.
      operationId: listMyRejectedRequests
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 반려한 요청 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/RejectedRequestListResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/quotes/{quoteId}':
    get:
      tags: [Quotes]
      summary: 견적 상세
      description: 견적 요청자 본인이 견적가와 기사님 정보를 조회합니다.
      operationId: getQuote
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 견적 상세
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/QuoteDetail' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
      x-roles: [CUSTOMER]
  '/quotes/{quoteId}/confirm':
    post:
      tags: [Quotes]
      summary: 견적 확정
      description: |-
        호출자 본인의 견적 요청에서 견적 하나를 확정합니다. 요청당 확정 견적은 하나이며,
        요청 상태와 견적 상태는 함께 갱신합니다. 기사님과 일반 유저에게 확정 알림을 보냅니다.
      operationId: confirmQuote
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/QuoteDetail' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: '`REQUEST_NOT_PENDING` (이미 확정되었거나 만료됨)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/quotes/{quoteId}/proof-photos':
    get:
      tags: [Quotes]
      summary: 작업 사진 목록
      description: >-
        견적을 보낸 기사님과 해당 견적 요청의 일반 유저만 조회할 수 있습니다. 올린 순서대로 반환하며, `maxCount`는 견적 하나에 올릴 수 있는 최대 장수입니다.
        `canEdit`이 `true`일 때만 사진 올리기와 삭제 버튼을 보여 줍니다.


        사진 주소는 CloudFront 서명 URL이며 발급 후 최소 1시간, 최대 2시간 동안 유효합니다.
        같은 시간대(정각 기준 1시간)에는 같은 주소를 반환하므로 다시 조회해도 이미지를 새로 받지 않습니다.
        화면을 1시간 넘게 열어 둘 때는 목록을 다시 조회해 주소를 갱신합니다.
      operationId: listProofPhotos
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 작업 사진 목록
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ProofPhotoList' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '503':
          description: '`UPLOAD_NOT_CONFIGURED`. 사진이 있는데 서버에 `CLOUDFRONT_KEY_PAIR_ID`·`CLOUDFRONT_PRIVATE_KEY` 중 하나라도 없는 경우 (로컬 개발 환경 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    post:
      tags: [Quotes]
      summary: 작업 사진 업로드 확정
      description: >-
        `POST /quotes/{quoteId}/proof-photos/uploads`로 받은 업로드 정보로 사진과 썸네일을 S3에 모두 올린 뒤,
        사진 한 장마다 `uploadId`를 보내 확정합니다. 확정된 사진만 목록에 나타납니다.
        같은 `uploadId`를 다시 보내면 이미 저장된 사진을 그대로 반환하므로, 응답을 받지 못했을 때 안전하게 재시도할 수 있습니다.
        그 사이 리뷰가 작성되거나 100장이 차도 이미 저장된 사진은 그대로 반환합니다.
        삭제된 사진의 `uploadId`는 `PROOF_PHOTO_DELETED`로 거절하며 다시 업로드하지 않습니다.
      operationId: confirmProofPhoto
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ProofPhotoConfirm' }
      responses:
        '201':
          description: 확정 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ProofPhoto' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` 또는 `PROOF_PHOTO_NOT_ALLOWED` (확정되지 않았거나 이사일이 지나지 않은 견적)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: >-
            `PROOF_PHOTO_LIMIT_REACHED` (이미 100장을 올림),
            `PROOF_PHOTO_NOT_UPLOADED` (사진이나 썸네일이 S3에 없음. 업로드 정보를 다시 받아 올린 뒤 확정),
            `PROOF_PHOTO_DELETED` (삭제된 사진의 `uploadId`. 재업로드 및 재시도 금지) 또는
            `PROOF_PHOTO_REVIEWED` (업로드 정보를 받은 뒤 리뷰가 작성됨)
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '503':
          description: '`UPLOAD_NOT_CONFIGURED`. 서버에 `AWS_REGION`·`S3_BUCKET`·`IMAGE_BASE_URL`·`CLOUDFRONT_KEY_PAIR_ID`·`CLOUDFRONT_PRIVATE_KEY` 중 하나라도 없는 경우 (로컬 개발 환경 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/quotes/{quoteId}/proof-photos/{photoId}':
    delete:
      tags: [Quotes]
      summary: 작업 사진 삭제
      description: >-
        기사님이 본인 견적의 작업 사진을 삭제합니다. 일반 유저가 리뷰를 작성한 뒤에는 올리기와 마찬가지로 삭제할 수 없습니다.
        사진을 먼저 목록에서 빼고, 이어서 사진과 썸네일, 확정할 때 쓴 업로드 파일을 S3에서 지웁니다. 삭제된 `uploadId`는 기록으로 남겨 다시 확정해도 사진이 되살아나지 않습니다.
        S3에서 파일을 지우지 못하면 사진은 목록에서 빠진 채 `INTERNAL_ERROR`(500)를 반환합니다. 같은 요청을 다시 보내면 파일 삭제를 다시 시도하며, 이미 삭제한 사진을 다시 삭제해도 204를 반환합니다.
      operationId: deleteProofPhoto
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
        - { '$ref': '#/components/parameters/PhotoIdPath' }
      responses:
        '204':
          description: 삭제 완료. 응답 본문 없음.
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND`. 본인 견적의 사진이 아님'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '409':
          description: '`PROOF_PHOTO_REVIEWED`. 리뷰가 작성된 견적의 사진은 삭제할 수 없습니다.'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '503':
          description: '`UPLOAD_NOT_CONFIGURED`. 서버에 `AWS_REGION`·`S3_BUCKET`·`IMAGE_BASE_URL` 중 하나라도 없는 경우 (로컬 개발 환경 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/quotes/{quoteId}/proof-photos/uploads':
    post:
      tags: [Quotes]
      summary: 작업 사진 업로드 정보 발급
      description: >-
        기사님이 본인의 확정된 견적에 올릴 사진 `count`장의 S3 업로드 정보를 받습니다.
        한국 시간(Asia/Seoul) 기준 이사일 다음 날부터 일반 유저가 리뷰를 작성하기 전까지 받을 수 있으며, 이미 확정된 사진과 합쳐 100장을 넘을 수 없습니다.


        사진마다 `image`(긴 변 약 2000px)와 `thumbnail`(긴 변 약 300px)을 브라우저에서 WebP나 JPEG로 다시 인코딩해 각각 올립니다.
        다시 인코딩해야 위치 정보 등 EXIF 메타데이터가 지워지므로 원본 파일을 그대로 올리지 않습니다.
        `contentType`에는 인코딩한 형식을 보내며 사진과 썸네일 모두 이 형식이어야 합니다. `.jpg` 파일도 `image/jpeg`입니다.
        Safari처럼 canvas가 WebP로 인코딩하지 못하는 브라우저에서는 `image/jpeg`를 씁니다.
        `url`로 `multipart/form-data` POST를 보내며, `fields`를 그대로 담고 파일은 마지막 `file` 필드에 넣습니다.
        S3가 `Content-Type`이 `contentType`과 같은지, 크기(사진 5MB, 썸네일 512KB 이하), 발급 후 10분 이내인지 확인합니다.
        두 파일을 모두 올린 뒤 `POST /quotes/{quoteId}/proof-photos`로 확정합니다.
      operationId: createProofPhotoUploads
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ProofPhotoUploadCreate' }
      responses:
        '201':
          description: 업로드 정보
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ProofPhotoUploadList' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` 또는 `PROOF_PHOTO_NOT_ALLOWED` (확정되지 않았거나 이사일이 지나지 않은 견적)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
        '409':
          description: >-
            `PROOF_PHOTO_LIMIT_REACHED` (확정된 사진과 합쳐 100장을 넘음) 또는
            `PROOF_PHOTO_REVIEWED` (리뷰가 작성된 견적)
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '503':
          description: '`UPLOAD_NOT_CONFIGURED`. 서버에 `AWS_REGION`·`S3_BUCKET`·`IMAGE_BASE_URL` 중 하나라도 없는 경우 (로컬 개발 환경 등)'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/quotes/{quoteId}/progress':
    get:
      tags: [Quotes]
      summary: 이사 진행 단계 조회
      description: >-
        견적을 보낸 기사님과 해당 견적 요청의 일반 유저만 조회할 수 있습니다. 기록한 단계와 기록 시각을 단계 순서대로 반환합니다.
        확정되지 않은 견적이거나 아직 기록한 단계가 없으면 `steps`가 빈 배열입니다.
        `canRecord`가 `true`일 때만 `nextStep` 기록 버튼을 보여 줍니다.
      operationId: getMoveProgress
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      responses:
        '200':
          description: 진행 상황
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveProgress' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '404':
          description: '`NOT_FOUND`. 견적을 보낸 기사님이나 견적을 요청한 일반 유저가 아님'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
    post:
      tags: [Quotes]
      summary: 이사 진행 단계 기록
      description: >-
        견적을 보낸 기사님은 견적과 이사 요청이 모두 `CONFIRMED`인 경우에만 이사 당일(한국 시간 Asia/Seoul 기준) 다음 진행 단계를 기록할 수 있습니다.
        단계는 출발(`DEPARTED`) → 상차(`LOADING`) → 운행(`IN_TRANSIT`) → 하차(`UNLOADING`) → 완료(`COMPLETED`) 순서로 하나씩만 기록할 수 있으며,
        응답의 `nextStep`을 `step`에 담아 보냅니다.
        이미 기록한 단계를 다시 보내면 새로 저장하지 않고 현재 진행 상황을 그대로 반환하므로, 응답을 받지 못했을 때 안전하게 재시도할 수 있습니다.
        이사 요청이 완료되거나 이사일이 지난 뒤에도 이미 기록한 단계는 같은 방식으로 반환합니다.
        완료를 기록해도 리뷰 작성과 작업 사진 업로드는 기존과 같이 이사일 다음 날부터 가능합니다.
      operationId: recordMoveProgress
      security:
        - sessionCookie: []
      x-roles: [MOVER]
      parameters:
        - { '$ref': '#/components/parameters/QuoteIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/MoveProgressRecord' }
      responses:
        '200':
          description: 기록 후 진행 상황
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveProgress' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND`. 본인이 보낸 견적이 아님'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            `MOVE_PROGRESS_NOT_ALLOWED` (견적 또는 이사 요청이 `CONFIRMED` 상태가 아니거나 이사 당일이 아님) 또는
            `MOVE_PROGRESS_OUT_OF_ORDER` (`step`이 현재 단계의 바로 다음 단계가 아님).
            진행 상황을 다시 조회해 화면을 갱신합니다.
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
  '/reviews':
    post:
      tags: [Reviews]
      summary: 리뷰 작성
      description: >-
        호출자 본인의 확정된 견적에 대해 리뷰를 작성합니다(§11.1).
        한국 시간(Asia/Seoul) 기준 이사일 다음 날부터 작성할 수 있습니다.
        동일 견적에 대해서는 리뷰를 한 번만 작성할 수 있습니다.
      operationId: createReview
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: 생성 완료
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MyReview' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN`, `PROFILE_REQUIRED` 또는 `REVIEW_NOT_ALLOWED`'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '404': { '$ref': '#/components/responses/NotFound' }
  '/customers/me/reviews':
    get:
      tags: [Reviews]
      summary: 내가 작성한 리뷰
      operationId: listMyReviews
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 목록 페이지
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MyReviewListResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/customers/me/reviews/writable':
    get:
      tags: [Reviews]
      summary: 작성 가능한 리뷰 목록
      description: >-
        본인의 확정 견적(CONFIRMED) 중 한국 시간(Asia/Seoul) 기준
        이사일이 지났고 아직 리뷰를 작성하지 않은 견적만 조회합니다.
      operationId: listWritableReviews
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - { '$ref': '#/components/parameters/Page' }
        - { '$ref': '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 리뷰 작성 대기 중인 확정 견적 목록 페이지
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/WritableReviewListResponse' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
  '/notifications':
    get:
      tags: [Notifications]
      summary: 알림 목록 조회
      description: 로그인 세션으로 인증된 고객·기사님의 미읽음 알림과 생성 후 30일 이내의 읽은 알림을 최신순으로 10개씩 조회합니다. 미읽음 알림은 기간과 관계없이 포함하며, 읽음 여부는 `readAt`으로 구분합니다.
      operationId: listNotifications
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                { '$ref': '#/components/schemas/NotificationListResponse' }
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/unread-count':
    get:
      tags: [Notifications]
      summary: 미읽음 알림 개수 조회
      operationId: getUnreadNotificationCount
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 미읽음 알림 개수
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount]
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/read-all':
    patch:
      tags: [Notifications]
      summary: 전체 알림 읽음 처리
      operationId: readAllNotifications
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 전체 알림 읽음 처리 결과
          content:
            application/json:
              schema:
                type: object
                required: [updatedCount]
                properties:
                  updatedCount:
                    type: integer
                    minimum: 0
        '401':
          '$ref': '#/components/responses/Unauthorized'

  '/notifications/{id}/read':
    patch:
      tags: [Notifications]
      summary: 개별 알림 읽음 처리
      operationId: readNotification
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 개별 알림 읽음 처리 결과
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: boolean
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
  '/chats/{chatRoomId}/messages':
    get:
      tags: [Chats]
      summary: 채팅 메시지 목록 조회
      description: |
        채팅방 참여자만 메시지를 조회할 수 있습니다.
        메시지는 생성 시각과 ID 기준 내림차순으로 조회합니다.
        cursor 기반 페이지네이션을 사용합니다.
        견적이 NOT_SELECTED 상태여도 기존 메시지는 조회할 수 있습니다.
      operationId: listChatMessages
      security:
        - sessionCookie: []
      parameters:
        - name: chatRoomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          description: 이전 응답의 nextCursor 값
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 한 페이지에 조회할 메시지 수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 채팅 메시지 목록
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ChatMessageListResponse'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          description: 채팅방 참여자가 아닌 경우
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'

    post:
      tags: [Chats]
      summary: 채팅 메시지 전송
      description: |
        채팅방 참여자만 메시지를 전송할 수 있습니다.
        견적이 NOT_SELECTED 상태인 채팅방에는 새 메시지를 전송할 수 없습니다.
      operationId: sendChatMessage
      security:
        - sessionCookie: []
      parameters:
        - name: chatRoomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SendChatMessageRequest'
      responses:
        '201':
          description: 메시지 전송 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ChatMessage'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          description: 채팅방 참여자가 아니거나 메시지 전송이 제한된 견적 상태인 경우
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'

  '/chats/{chatRoomId}/images/uploads':
    post:
      tags: [Chats]
      summary: 채팅 이미지 업로드 URL 발급
      description: |
        채팅방 참여자에게 S3 Presigned POST 업로드 정보를 발급합니다.
        이미지 업로드는 JPEG, PNG, WEBP 형식만 지원하며 최대 5MB까지 가능합니다.
        한 번에 1~5개의 업로드 정보를 요청할 수 있습니다.
        발급된 업로드 URL은 10분 동안 유효합니다.
        견적이 NOT_SELECTED 상태인 채팅방에는 발급할 수 없습니다.
      operationId: createChatImageUploads
      security:
        - sessionCookie: []
      parameters:
        - name: chatRoomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/CreateChatImageUploadsRequest'
      responses:
        '201':
          description: 이미지 업로드 정보 발급 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ChatImageUploadsResponse'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          description: 채팅방 참여자가 아니거나 이미지 업로드가 제한된 경우
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'

  '/chats':
    get:
      tags: [Chats]
      summary: 채팅방 목록 조회
      description: 로그인한 사용자의 채팅방 목록을 최근 메시지 순으로 조회합니다.
      operationId: listChats
      security:
        - sessionCookie: []
      parameters:
        - { '$ref': '#/components/parameters/Cursor' }
        - name: limit
          in: query
          required: false
          description: 한 페이지에 조회할 채팅방 수
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 채팅방 목록
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ChatListResponse'
        '400':
          '$ref': '#/components/responses/ValidationError'
        '401':
          '$ref': '#/components/responses/Unauthorized'
  '/chats/{chatRoomId}/read':
    patch:
      tags: [Chats]
      summary: 채팅방 읽음 처리
      description: 채팅방 참여자의 마지막 읽은 시각을 현재 시각으로 갱신합니다.
      operationId: markChatRoomAsRead
      security:
        - sessionCookie: []
      parameters:
        - name: chatRoomId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 읽음 처리 완료
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ChatReadResponse'
        '401':
          '$ref': '#/components/responses/Unauthorized'
        '403':
          description: 채팅방 참여자가 아닌 경우
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  '/estimates':
    get:
      tags: [MoveRequests]
      summary: 이사 예상 비용
      description: |-
        견적 요청 전에 이사 유형 · 날짜 · 출발지 · 도착지로 대략적인 예상 비용을 계산합니다.
        거리는 카카오 로컬 API로 주소를 좌표로 바꾼 뒤 직선거리에 1.3을 곱해 구합니다.
        유형별 기본료에 거리 요금을 더하고, 주말 · 공휴일이면 추가 비용을 붙입니다(겹치면 높은 비율 하나만 적용).
        계산값의 ±15%를 만 원 단위로 반올림해 범위로 반환합니다.
      operationId: getMoveEstimate
      security:
        - sessionCookie: []
      x-roles: [CUSTOMER]
      parameters:
        - name: moveType
          in: query
          required: true
          schema: { '$ref': '#/components/schemas/ServiceType' }
        - name: moveDate
          in: query
          required: true
          description: 이사 날짜. 한국 시간 기준 오늘 또는 이후
          schema: { type: string, format: date }
        - name: from
          in: query
          required: true
          description: 출발지 주소. 끝의 괄호 참고 항목은 빼고 검색합니다.
          schema: { type: string, maxLength: 200 }
        - name: to
          in: query
          required: true
          description: 도착지 주소. 끝의 괄호 참고 항목은 빼고 검색합니다.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 예상 비용
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/MoveEstimate' }
        '400': { '$ref': '#/components/responses/ValidationError' }
        '401': { '$ref': '#/components/responses/Unauthorized' }
        '403': { '$ref': '#/components/responses/Forbidden' }
        '422':
          description: '`ADDRESS_NOT_FOUND`. 출발지나 도착지 주소로 좌표를 찾지 못한 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
        '503':
          description: '`SERVICE_UNAVAILABLE`. 서버에 카카오 REST API 키(`KAKAO_CLIENT_ID`)가 없거나 카카오 API 호출에 실패한 경우'
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: moving.sid
      description: express-session에서 발급한 세션 쿠키
  parameters:
    ProviderPath:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, kakao, naver]
    MoverIdPath:
      name: moverId
      in: path
      required: true
      description: 기사님의 user id
      schema: { type: string, format: uuid }
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuoteIdPath:
      name: quoteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PhotoIdPath:
      name: photoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: 이전 페이지의 `nextCursor`. 첫 페이지에서는 생략합니다.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      description: 페이지 번호. 생략하면 1
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 페이지당 개수. 생략하면 10
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`. `details`에 유효하지 않은 필드별 정보가 담깁니다.'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: 잘못된 요청입니다
              details:
                - field: password
                  reason:
                    must be at least 8 characters and include a letter, a number,
                    and a special character
    Unauthorized:
      description: 인증 정보가 없거나 유효하지 않음
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    InvalidSession:
      description: '`UNAUTHORIZED`. 만료되었거나 유효하지 않은 세션 쿠키를 보낸 경우. 응답에서 쿠키를 지우므로 다시 요청하면 비회원으로 조회됩니다.'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    Forbidden:
      description:
        '`FORBIDDEN` (역할이 다르거나 본인 소유가 아님) 또는 `PROFILE_REQUIRED` (사용자를 프로필
        등록 화면으로 이동)'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: '`RATE_LIMITED`'
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { '$ref': '#/components/schemas/ErrorResponse' }
  schemas:
    Role:
      type: string
      enum: [CUSTOMER, MOVER]
    ServiceType:
      type: string
      description: SMALL 소형이사, HOME 가정이사, OFFICE 사무실이사
      enum: [SMALL, HOME, OFFICE]
    MoveEstimate:
      type: object
      required: [distanceKm, minPrice, maxPrice, surcharges]
      properties:
        distanceKm:
          { type: number, description: '예상 이동 거리 (km, 소수점 첫째 자리)' }
        minPrice:
          { type: integer, description: '예상 비용 최솟값 (원, 만 원 단위)' }
        maxPrice:
          { type: integer, description: '예상 비용 최댓값 (원, 만 원 단위)' }
        surcharges:
          type: array
          description: 적용된 추가 비용 사유. WEEKEND 주말, HOLIDAY 공휴일
          items: { type: string, enum: [WEEKEND, HOLIDAY] }
    Region:
      {
        type: string,
        description:
          '시/도 줄임 명칭: 서울, 경기, 인천, 강원, 충북, 충남, 세종, 대전, 전북, 전남, 광주, 경북, 경남, 대구, 울산, 부산,
          제주',
      }
    MoveRequestStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, EXPIRED]
    QuoteStatus:
      type: string
      enum: [SUBMITTED, CONFIRMED, NOT_SELECTED]
    NotificationType:
      type: string
      enum:
        [
          NEW_REQUEST,
          NEW_DESIGNATED_REQUEST,
          NEW_QUOTE,
          QUOTE_CONFIRMED,
          MOVE_DAY,
        ]
    MoverSort:
      type: string
      description:
        리뷰 많은 순 / 평점 높은 순 / 경력 많은 순 / 확정 많은 순. 값이 같으면 기사님 id 순서이며,
        경력순에서는 경력을 입력하지 않은 기사님이 마지막에 옵니다.
      enum: [REVIEW_COUNT, RATING, CAREER, CONFIRMED_COUNT]
    ReceivedRequestSort:
      type: string
      description: 이사 빠른 순 / 최근 요청 순
      enum: [MOVE_DATE_ASC, CREATED_DESC]
    ErrorCode:
      type: string
      description: 주요 오류 코드 초안. 세부 오류 분류와 메시지는 구현 시 결정합니다.
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - EMAIL_ALREADY_EXISTS
        - FORBIDDEN
        - PROFILE_REQUIRED
        - NOT_IN_SERVICE_AREA
        - REVIEW_NOT_ALLOWED
        - PROOF_PHOTO_NOT_ALLOWED
        - NOT_FOUND
        - PROFILE_ALREADY_EXISTS
        - ACTIVE_REQUEST_EXISTS
        - ALREADY_DESIGNATED
        - MOVER_ALREADY_RESPONDED
        - DESIGNATION_LIMIT_REACHED
        - REQUEST_NOT_PENDING
        - REQUEST_HAS_QUOTES
        - QUOTE_LIMIT_REACHED
        - PROOF_PHOTO_LIMIT_REACHED
        - PROOF_PHOTO_NOT_UPLOADED
        - MOVE_PROGRESS_NOT_ALLOWED
        - MOVE_PROGRESS_OUT_OF_ORDER
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - UPLOAD_NOT_CONFIGURED
        - SOCIAL_LOGIN_FAILED
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { '$ref': '#/components/schemas/ErrorCode' }
            message:
              {
                type: string,
                description:
                  오류 안내. 운영 환경에서는 스택 트레이스 등 내부 상세 정보를
                  노출하지 않습니다.,
              }
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
    CursorMeta:
      type: object
      required: [nextCursor, hasNext]
      properties:
        nextCursor: { type: string, nullable: true }
        hasNext: { type: boolean }
    OffsetMeta:
      type: object
      required: [page, pageSize, totalCount, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
        totalPages: { type: integer }
    UploadResponse:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ProofPhoto:
      type: object
      required: [id, url, thumbnailUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: 사진 CloudFront 서명 URL. 발급 후 최소 1시간, 최대 2시간 동안 유효합니다.
        thumbnailUrl:
          type: string
          format: uri
          description: 썸네일 CloudFront 서명 URL. `url`과 같은 시각에 만료됩니다.
        createdAt: { type: string, format: date-time }
    ProofPhotoUploadCreate:
      type: object
      required: [count, contentType]
      properties:
        count: { type: integer, minimum: 1, maximum: 100, example: 10 }
        contentType:
          type: string
          enum: [image/jpeg, image/webp]
          example: image/webp
    ProofPhotoUploadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { '$ref': '#/components/schemas/ProofPhotoUpload' }
    ProofPhotoUpload:
      type: object
      required: [uploadId, image, thumbnail]
      properties:
        uploadId: { type: string, format: uuid }
        image: { '$ref': '#/components/schemas/PresignedPost' }
        thumbnail: { '$ref': '#/components/schemas/PresignedPost' }
    PresignedPost:
      type: object
      description: S3 presigned POST. `url`로 `fields`와 마지막 `file` 필드를 담은 `multipart/form-data`를 보냅니다.
      required: [url, fields]
      properties:
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
    ProofPhotoConfirm:
      type: object
      required: [uploadId]
      properties:
        uploadId: { type: string, format: uuid }
    ProofPhotoList:
      type: object
      required: [items, maxCount, canEdit]
      properties:
        items:
          type: array
          items: { '$ref': '#/components/schemas/ProofPhoto' }
        maxCount: { type: integer, example: 100 }
        canEdit:
          type: boolean
          description: 호출자가 지금 사진을 올리거나 삭제할 수 있으면 `true` (견적을 보낸 기사님, 이사일 다음 날부터 리뷰 작성 전까지)
    MoveProgressStep:
      type: string
      description: DEPARTED 출발, LOADING 상차, IN_TRANSIT 운행, UNLOADING 하차, COMPLETED 완료. 이 순서대로 기록합니다.
      enum: [DEPARTED, LOADING, IN_TRANSIT, UNLOADING, COMPLETED]
    MoveProgressRecord:
      type: object
      required: [step]
      properties:
        step: { '$ref': '#/components/schemas/MoveProgressStep' }
    MoveProgressEntry:
      type: object
      required: [step, recordedAt]
      properties:
        step: { '$ref': '#/components/schemas/MoveProgressStep' }
        recordedAt: { type: string, format: date-time }
    MoveProgress:
      type: object
      required: [steps, nextStep, canRecord]
      properties:
        steps:
          type: array
          description: 기록한 단계. 출발부터 단계 순서대로 정렬합니다.
          items: { '$ref': '#/components/schemas/MoveProgressEntry' }
        nextStep:
          type: string
          enum: [DEPARTED, LOADING, IN_TRANSIT, UNLOADING, COMPLETED, null]
          nullable: true
          description: 다음에 기록할 단계. 완료까지 기록했으면 `null`
        canRecord:
          type: boolean
          description: 견적을 보낸 기사님이고, 견적과 이사 요청이 모두 확정 상태이며, 이사 당일에 기록할 단계가 남아 있으면 `true`
          example: true
    SignupRequest:
      type: object
      required: [role, name, email, phone, password]
      properties:
        role: { '$ref': '#/components/schemas/Role' }
        name:
          type: string
          minLength: 2
          maxLength: 20
          description: 앞뒤 공백 제거 후 2~20자
        email: { type: string, format: email }
        phone:
          {
            type: string,
            description: 지역에 맞는 전화번호 형식을 검증합니다(§3.2.1).,
          }
        password:
          {
            type: string,
            format: password,
            description: '공백을 제외한 ASCII 문자 8~16자. 영문·숫자·특수문자를 각각 1자 이상 포함',
            minLength: 8,
            maxLength: 16,
          }
    LoginRequest:
      type: object
      required: [role, email, password]
      properties:
        role: { '$ref': '#/components/schemas/Role' }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }
    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { '$ref': '#/components/schemas/Me' }
    Me:
      type: object
      required:
        [
          id,
