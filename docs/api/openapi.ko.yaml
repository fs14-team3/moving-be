          description: 옮길 짐 목록. 선택 입력이며 빈 배열이면 짐을 입력하지 않은 요청입니다. 같은 item은 한 번만 보낼 수 있습니다.
          items: { '$ref': '#/components/schemas/MoveRequestItem' }
        boxRange: { '$ref': '#/components/schemas/BoxRange' }
        memo:
          type: string
          maxLength: 200
          nullable: true
          description: 기사님께 전할 요청사항. 빈 문자열은 null로 저장됩니다.
    MoveRequestCreate:
      type: object
      required: [moveType, moveDate, from, to]
      properties:
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate:
          {
            type: string,
            format: date,
            description: 이사 날짜. 한국 시간 기준 오늘 또는 이후,
          }
        from: { '$ref': '#/components/schemas/AddressInput' }
        to: { '$ref': '#/components/schemas/AddressInput' }
        details:
          description: 이사 상세 정보. 생략하면 상세 정보 없이 요청을 만듭니다.
          allOf:
            - { '$ref': '#/components/schemas/MoveRequestDetails' }
    MoveRequest:
      type: object
      required:
        [
          id,
          moveType,
          moveDate,
          from,
          to,
          details,
          status,
          quoteCount,
          designatedMoverIds,
          createdAt,
          confirmedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        from: { '$ref': '#/components/schemas/Address' }
        to: { '$ref': '#/components/schemas/Address' }
        details:
          description: 상세 정보 없이 만든 요청은 null
          oneOf:
            - { '$ref': '#/components/schemas/MoveRequestDetails' }
            - { enum: [null] }
        status: { '$ref': '#/components/schemas/MoveRequestStatus' }
        quoteCount: { type: integer, maximum: 8 }
        designatedMoverIds:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
    MoveRequestWithQuotes:
      allOf:
        - { '$ref': '#/components/schemas/MoveRequest' }
        - type: object
          required: [quotes]
          properties:
            quotes:
              type: array
              maxItems: 8
              items: { '$ref': '#/components/schemas/CustomerQuote' }
    MoveRequestHistoryResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/MoveRequestWithQuotes' }
    DesignationCreate:
      type: object
      required: [moverId]
      properties:
        moverId: { type: string, format: uuid }
    Designation:
      type: object
      required: [moveRequestId, moverId, createdAt]
      properties:
        moveRequestId: { type: string, format: uuid }
        moverId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    CustomerQuote:
      description: 견적을 요청한 일반 유저에게 보이는 견적
      type: object
      required: [id, price, comment, status, isDesignated, createdAt, mover]
      properties:
        id: { type: string, format: uuid }
        price: { type: integer, description: 원(KRW), example: 350000 }
        comment:
          type: string
          nullable: true
          description: 기사님이 견적 제출 시 입력한 코멘트. 미입력 시 null.
        status: { '$ref': '#/components/schemas/QuoteStatus' }
        isDesignated: { type: boolean, description: 지정 견적 라벨 표시용 }
        createdAt: { type: string, format: date-time }
        mover: { '$ref': '#/components/schemas/MoverSummary' }
    QuoteDetail:
      allOf:
        - { '$ref': '#/components/schemas/CustomerQuote' }
        - type: object
          required: [confirmedAt, moveRequest]
          properties:
            confirmedAt:
              type: string
              format: date-time
              nullable: true
            moveRequest:
              '$ref': '#/components/schemas/MoveRequest'
            mover:
              '$ref': '#/components/schemas/MoverDetail'
    QuoteCreate:
      type: object
      required: [price]
      properties:
        price: { type: integer, description: 견적가 (원) }
        comment:
          type: string
          nullable: true
          description: 견적 코멘트. 선택 입력이며 빈 문자열은 null로 저장됩니다.
    RequestForMover:
      description: 기사님에게 보이는 견적 요청
      type: object
      required:
        [
          id,
          customerName,
          moveType,
          moveDate,
          from,
          to,
          details,
          status,
          isDesignated,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        customerName:
          type: string
          nullable: true
          description: 고객의 User.name을 반환하며, 이름이 없으면 null을 반환합니다.
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        from: { '$ref': '#/components/schemas/Address' }
        to: { '$ref': '#/components/schemas/Address' }
        details:
          description: 상세 정보 없이 만든 요청은 null
          oneOf:
            - { '$ref': '#/components/schemas/MoveRequestDetails' }
            - { enum: [null] }
        status: { '$ref': '#/components/schemas/MoveRequestStatus' }
        isDesignated: { type: boolean }
        createdAt: { type: string, format: date-time }
    ReceivedRequestListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/RequestForMover' }
    SentQuote:
      description: 견적을 보낸 기사님에게 보이는 견적
      type: object
      required:
        [id, price, comment, status, isDesignated, createdAt, moveRequest]
      properties:
        id: { type: string, format: uuid }
        price: { type: integer }
        comment: { type: string, nullable: true }
        status: { '$ref': '#/components/schemas/QuoteStatus' }
        isDesignated: { type: boolean }
        createdAt: { type: string, format: date-time }
        moveRequest: { '$ref': '#/components/schemas/RequestForMover' }
    SentQuoteListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/SentQuote' }
    RejectedRequest:
      type: object
      required: [moveRequest, rejectedAt, reason]
      properties:
        moveRequest: { '$ref': '#/components/schemas/RequestForMover' }
        rejectedAt: { type: string, format: date-time }
        reason:
          type: string
          nullable: true
          description: 반려 사유. 입력하지 않은 경우 null을 반환합니다.
    RejectedRequestListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/RejectedRequest' }
    ReviewCreate:
      type: object
      required: [quoteId, rating, content]
      properties:
        quoteId: { type: string, format: uuid }
        rating: { type: integer, description: 평점 (1~5점) }
        content: { type: string }
    Review:
      description: 기사님 페이지에 표시되는 리뷰
      type: object
      required: [id, rating, content, customerName, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, description: 평점 (1~5점) }
        content: { type: string }
        customerName:
          {
            type: string,
            description: '리뷰 작성자 이름. 첫 글자만 남기고 `*`로 가리며 이름이 없으면 null',
            nullable: true,
          }
        createdAt: { type: string, format: date-time }
    MoverReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/Review' }
    MoverReviewSummary:
      type: object
      nullable: true
      required: [reviewCount, summary, aspects]
      properties:
        reviewCount: { type: integer }
        summary: { type: string }
        aspects:
          type: array
          items: { '$ref': '#/components/schemas/ReviewSummaryAspect' }
    ReviewSummaryAspect:
      type: object
      required: [key, mentionCount, positiveCount, negativeCount]
      properties:
        key:
          type: string
          enum: [PUNCTUALITY, HANDLING, SPEED, COMMUNICATION, PRICE]
        mentionCount: { type: integer }
        positiveCount: { type: integer }
        negativeCount: { type: integer }
    ReviewTarget:
      description: 리뷰 대상인(또는 리뷰할 수 있는) 완료된 이사
      type: object
      required:
        [quoteId, price, isDesignated, moveType, moveDate, from, to, mover]
      properties:
        quoteId: { type: string, format: uuid }
        price: { type: integer }
        isDesignated: { type: boolean }
        moveType: { '$ref': '#/components/schemas/ServiceType' }
        moveDate: { type: string, format: date }
        mover: { '$ref': '#/components/schemas/MoverSummary' }
        from:
          $ref: '#/components/schemas/Address'
        to:
          $ref: '#/components/schemas/Address'
    MyReview:
      allOf:
        - { '$ref': '#/components/schemas/ReviewTarget' }
        - type: object
          required: [id, rating, content, createdAt]
          properties:
            id: { type: string, format: uuid }
            rating: { type: integer, description: 평점 (1~5점) }
            content: { type: string }
            createdAt: { type: string, format: date-time }
    MyReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/MyReview' }
    WritableReviewListResponse:
      allOf:
        - { '$ref': '#/components/schemas/OffsetMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/ReviewTarget' }
    Notification:
      type: object
      required: [id, userId, type, payload, readAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type: { '$ref': '#/components/schemas/NotificationType' }
        message: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }
        moveRequestId: { type: string, format: uuid, nullable: true }
        quoteId: { type: string, format: uuid, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/Notification' }
    ChatMessage:
      type: object
      required:
        [id, chatRoomId, senderId, content, createdAt, senderName, images]
      properties:
        id: { type: string, format: uuid }
        chatRoomId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        senderName:
          type: string
          nullable: true
          description: 메시지 작성자 이름
        images:
          type: array
          description: 메시지에 첨부된 이미지 목록
          items:
            '$ref': '#/components/schemas/ChatMessageImage'
    ChatMessageImage:
      type: object
      required: [id, url, contentType, createdAt]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          format: uri
          description: CloudFront 서명 URL
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        createdAt: { type: string, format: date-time }
    ChatMessageListResponse:
      allOf:
        - { '$ref': '#/components/schemas/CursorMeta' }
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { '$ref': '#/components/schemas/ChatMessage' }
    SendChatMessageRequest:
      type: object
      description: |
        텍스트 또는 이미지를 포함한 메시지를 전송합니다.
        content와 imageUploadIds 중 하나 이상은 유효한 값을 포함해야 합니다.
        이미지 업로드 URL 발급 후 S3 업로드를 완료한 uploadId를 전달해야 합니다.
        공백만 포함된 content는 이미지가 없는 경우 허용되지 않습니다.
      properties:
        content:
          type: string
          description: 메시지 내용. 생략할 수 있으며 이미지 전용 메시지는 빈 문자열을 허용합니다.
        imageUploadIds:
          type: array
          maxItems: 5
          uniqueItems: true
          default: []
          description: 발급받은 이미지 업로드 ID 목록
          items:
            type: string
            format: uuid
      anyOf:
        - required: [content]
          properties:
            content:
              type: string
              minLength: 1
        - required: [imageUploadIds]
          properties:
            imageUploadIds:
              type: array
              minItems: 1
              maxItems: 5
              uniqueItems: true
              items:
                type: string
                format: uuid

    CreateChatImageUploadsRequest:
      type: object
      required: [count, contentType]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 5
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    ChatImageUploadsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [uploadId, url, fields, contentType, maxSize]
            properties:
              uploadId:
                type: string
                format: uuid
              url:
                type: string
                format: uri
              fields:
                type: object
                additionalProperties:
                  type: string
              contentType:
                type: string
                enum: [image/jpeg, image/png, image/webp]
              maxSize:
                type: integer
                example: 5242880
    ChatReadResponse:
      type: object
      required: [updated, lastReadAt]
      properties:
        updated: { type: boolean, enum: [true] }
        lastReadAt: { type: string, format: date-time }
    ChatOtherParticipant:
      type: object
      required: [id, role, name, imageUrl]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        name:
          type: string
          description: 상대방 이름 또는 기사님 닉네임
        imageUrl:
          type: string
          nullable: true
    ChatMoveRequestCustomer:
      type: object
      required: [imageUrl, user]
      properties:
        imageUrl:
          type: string
          nullable: true
        user:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
    ChatMoveRequestSummary:
      type: object
      required: [id, moveType, moveDate, fromRegion, toRegion, customer]
      properties:
        id:
          type: string
          format: uuid
        moveType:
          $ref: '#/components/schemas/ServiceType'
        moveDate:
          type: string
          format: date
        fromRegion:
          $ref: '#/components/schemas/Region'
        toRegion:
          $ref: '#/components/schemas/Region'
        customer:
          $ref: '#/components/schemas/ChatMoveRequestCustomer'
    ChatLastMessage:
      type: object
      required: [id, content, senderId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        senderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    ChatRoomListItem:
      type: object
      required:
        - id
        - createdAt
        - lastMessageAt
        - otherParticipant
        - quote
        - lastMessage
        - unreadCount
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        otherParticipant:
          $ref: '#/components/schemas/ChatOtherParticipant'
        quote:
          type: object
          required: [id, price, status, isDesignated, moveRequest]
          properties:
            id:
              type: string
              format: uuid
            price:
              type: number
              description: 견적 금액
            status:
              $ref: '#/components/schemas/QuoteStatus'
            isDesignated:
              type: boolean
            moveRequest:
              $ref: '#/components/schemas/ChatMoveRequestSummary'
        lastMessage:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ChatLastMessage'
        unreadCount:
          type: integer
          minimum: 0
          description: 읽지 않은 메시지 수
    ChatListResponse:
      allOf:
        - $ref: '#/components/schemas/CursorMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChatRoomListItem'
